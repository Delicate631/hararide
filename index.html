<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0d1530;--mu:#6a7595;--ln:#e3e8f3;--pr:#f97316;--pr2:#ea580c;--nv:#0a1330;--ok:#16a34a;--bad:#e11d48;--sh:0 10px 40px rgba(10,19,48,.18)}
html[data-th=dark]{--bg:#080e22;--card:#111b3a;--tx:#eef2ff;--mu:#9aa7c9;--ln:#23315e;--sh:0 10px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
h1,h2,h3,p{margin:0}
#map{position:fixed;inset:0;z-index:0}
html[data-th=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.75)}
.leaflet-control-attribution{font-size:10px}
.topbar{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:1300;display:flex;gap:10px;align-items:center}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--tx);box-shadow:var(--sh);font-size:19px;padding:0;cursor:pointer;display:grid;place-items:center}
.fab.loc{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:1300;color:var(--pr)}
.pill{background:var(--nv);color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;box-shadow:var(--sh);letter-spacing:-.3px}.pill b{color:var(--pr)}
.sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-height:68vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;box-shadow:var(--sh);padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 12px}
@media(min-width:900px){.sheet{left:20px;right:auto;top:76px;bottom:20px;width:410px;max-height:none;border-radius:24px;padding-top:18px}.sheet:before{display:none}}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px}h3{font-size:16px;font-weight:700}
.mu{color:var(--mu);font-size:13px}.cred{color:var(--mu);font-size:11px;text-align:center;margin-top:14px}
.btn{font:inherit;font-weight:600;padding:12px 16px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn{white-space:nowrap}.row .btn{padding:12px 8px}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.pr{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:10px}
.btn.bad{background:rgba(225,29,72,.1);color:var(--bad);border-color:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.between{justify-content:space-between}.row .fx{flex:0 0 auto}
.in{width:100%;padding:12px 13px;border:1px solid var(--ln);border-radius:13px;background:var(--bg);color:var(--tx);font:inherit;margin:5px 0;outline:none}
.in:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:78px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:16px;padding:8px 10px;text-align:center;font:inherit;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.chip span{font-size:26px;line-height:1.15}.chip.on{background:rgba(249,115,22,.14);border-color:var(--pr);font-weight:700}
.srch{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:0 14px}
.srch input{border:0;background:transparent;margin:0;padding:15px 0;font:inherit;font-size:16px;color:var(--tx);outline:none;width:100%}
.srch:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.sg{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.sg i{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal;flex:0 0 auto}
.sg small{display:block;color:var(--mu)}
.hd{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--mu);margin:14px 0 2px;text-transform:uppercase}
.pk{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:10px}.pk span{flex:1;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}.dot.b{background:#3b82f6}.dot.o{background:var(--pr)}
.trip{display:flex;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
.rt{display:flex;flex-direction:column;align-items:center;padding:6px 0}.rt u{flex:1;width:2px;background:var(--ln);margin:3px 0;min-height:18px}
.stops{flex:1;min-width:0}.st{padding:4px 0;cursor:pointer}.st small{display:block;color:var(--mu);font-size:12px}.st b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st+.st{border-top:1px solid var(--ln);margin-top:4px;padding-top:8px}
.meta{margin:12px 2px 4px;color:var(--mu)}
.price{display:flex;align-items:center;gap:10px;margin:12px 0}.price>div{flex:1;text-align:center}.price b{display:block;font-size:30px;letter-spacing:-1px}.price small{color:var(--mu)}
.price button{width:54px;height:54px;border-radius:16px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:26px;cursor:pointer;flex:0 0 auto}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin:6px 0}.seg button{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-weight:600;padding:10px;border-radius:11px;cursor:pointer}.seg button.on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--pr2)}
.radar{position:relative;width:150px;height:150px;margin:8px auto 14px;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pr);opacity:0;animation:rd 2.4s infinite}.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
.radar span{font-size:46px;position:relative}@keyframes rd{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
.center{text-align:center}
.tl{display:flex;gap:6px;margin:12px 0 4px}.tl div{flex:1;height:5px;border-radius:9px;background:var(--ln)}.tl .d{background:var(--pr)}
.tlt{display:flex;justify-content:space-between;color:var(--mu);font-size:11.5px}
.drv{display:flex;gap:12px;align-items:center;margin:12px 0}.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#16275c,#0a1330);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:0 0 auto}
.plate{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:1px 8px;font-weight:700;letter-spacing:1px}
.big2{font-size:26px;font-weight:800;color:var(--pr);letter-spacing:-.5px}
.stars{display:flex;justify-content:center;gap:2px}.stars button{font-size:34px;background:none;border:0;padding:2px;color:#f59e0b;cursor:pointer}
.sw{position:relative;width:58px;height:34px;flex:0 0 auto}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--ln);border-radius:99px;transition:.2s}.sw span:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:after{left:28px}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px}.pin .stat{background:var(--card);border:1px solid var(--ln)}.stat small{color:var(--mu);display:block}.stat b{font-size:22px;letter-spacing:-.5px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:10px 0}
.req{background:var(--bg);border-radius:18px;padding:14px;margin:10px 0}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;background:rgba(249,115,22,.15);color:var(--pr2)}
.tag.ok{background:rgba(22,163,74,.15);color:var(--ok)}.tag.bad{background:rgba(225,29,72,.13);color:var(--bad)}
.page{position:fixed;inset:0;z-index:1500;background:var(--bg);overflow:auto;display:none}.page.open{display:block}
.pin{max-width:640px;margin:auto;padding:0 16px 40px}
.ph{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:2;max-width:640px;margin:auto}.ph h2{font-size:24px}
.back{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.hrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;margin:8px 0}
.hrow .ic{width:52px;height:52px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.hrow .tx{flex:1;min-width:0}.hrow .tx small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hrow .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.hrow .pc{text-align:right;font-weight:800;font-size:17px}.hrow .pc small{display:block;color:var(--mu);font-weight:500}
.day{font-weight:800;margin:18px 2px 4px;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.tile i{font-style:normal;font-size:30px}
.sos{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bad);color:#fff;border-radius:16px;padding:16px;font-weight:800;font-size:18px;text-decoration:none;margin:10px 0}
.lst{background:var(--card);border:1px solid var(--ln);border-radius:20px;margin:10px 0;overflow:hidden}.li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--ln)}.li:first-child{border-top:0}.li .tx{flex:1}.li .tx small{display:block;color:var(--mu)}
details.fq{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:8px 0}details.fq summary{font-weight:700;cursor:pointer}details.fq p{margin-top:8px;color:var(--mu)}
#drawer{position:fixed;top:0;bottom:0;left:0;width:310px;max-width:86vw;background:var(--card);z-index:2100;transform:translateX(-104%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--sh);padding:calc(20px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));overflow:auto}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2050;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.open{opacity:1;pointer-events:auto}
.dp{display:flex;gap:12px;align-items:center;padding:0 20px 16px;border-bottom:1px solid var(--ln)}.dp b{font-size:18px}
.dn{flex:1;padding:8px 0}.di{display:flex;gap:16px;align-items:center;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer;border:0;background:none;color:var(--tx);width:100%;text-align:left;font-family:inherit}.di i{font-style:normal;width:26px;text-align:center;font-size:20px}.di.on{background:rgba(249,115,22,.12);color:var(--pr2)}
.dbot{padding:0 16px}
#splash{position:fixed;inset:0;z-index:3000;background:linear-gradient(160deg,#16275c,#0a1330);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}#splash .sp{font-size:72px;animation:bob 1.1s ease-in-out infinite}#splash h1{font-size:38px;letter-spacing:-1px}#splash h1 b{color:var(--pr)}#splash p{color:#aab6dd;letter-spacing:1px;font-size:12px}
@keyframes bob{50%{transform:translateX(10px) rotate(2deg)}}
.auth{max-width:440px;margin:auto;padding:calc(40px + env(safe-area-inset-top)) 20px 40px}
.auth .logo{text-align:center;margin-bottom:22px}.auth .logo h1{font-size:40px;letter-spacing:-1.5px}.auth .logo h1 b{color:var(--pr)}.auth .logo p{color:var(--mu);font-size:12px;letter-spacing:1px;margin-top:4px}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.rl button{border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:16px;padding:14px 8px;font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.rl button i{font-style:normal;font-size:28px}.rl button.on{border-color:var(--pr);background:rgba(249,115,22,.1)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--ln)}
details.sv{background:var(--bg);border-radius:14px;padding:10px 12px;margin:10px 0}details.sv summary{cursor:pointer;font-weight:600}
.leaflet-container{font:inherit;background:var(--bg)}
/* ---------- Haulie ---------- */
.haulie{position:fixed;z-index:1250;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 58px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
@media(min-width:900px){.haulie{left:444px;top:76px}}
.hface{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:3px solid #fff;background:linear-gradient(160deg,#16275c,#0a1330);box-shadow:var(--sh);padding:0;cursor:pointer;flex:0 0 auto;overflow:hidden}
.hface svg{width:100%;height:100%;display:block}
.hface .lid{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:blink 4.2s infinite}
.hface .lid.l2{animation-delay:.04s}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.hface .mo{transform-box:fill-box;transform-origin:center;transform:scaleY(.05)}
.hface.talk .mo{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.18) scaleX(.75)}to{transform:scaleY(1) scaleX(1)}}
.hface .pp{transition:transform .3s}
.hface.think .pp{transform:translate(2px,-3.5px)}
.hface .brow{transition:transform .3s}.hface.think .brow{transform:translateY(-2px)}
.hface.talk svg{animation:hbob .45s ease-in-out infinite alternate}
@keyframes hbob{to{transform:translateY(-1.5px) rotate(-1deg)}}
.hbub{pointer-events:auto;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:6px 18px 18px 18px;padding:10px 12px;box-shadow:var(--sh);max-width:min(270px,calc(100vw - 170px));font-weight:600;font-size:14px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(-4px) scale(.97);transition:opacity .2s,transform .2s,visibility .2s}
.hbub.on{opacity:1;visibility:visible;transform:none}
.hbub .hm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hbub .hm .btn{padding:6px 10px;font-size:12.5px;border-radius:10px}
.fab.mic{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 58px);right:12px;z-index:1300;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.vo{position:fixed;z-index:1400;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;box-shadow:var(--sh);padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:900px){.vo{left:20px;right:auto;bottom:20px;width:410px;border-radius:24px}}
.micbig{width:84px;height:84px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-size:34px;cursor:pointer;box-shadow:0 8px 24px rgba(249,115,22,.45)}
.micbig.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}100%{box-shadow:0 0 0 26px rgba(249,115,22,0)}}
.vtx{min-height:24px;margin:10px 0 2px;font-weight:700}
@media(prefers-reduced-motion:reduce){.hface .lid,.hface.talk svg,.micbig.on{animation:none}}
/* ---------- login page scene ---------- */
.page.authbg{background:#0a1330}
.authscene{position:fixed;inset:0;z-index:-1;background:#0a1330}
.authscene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.authscene.photo{background:linear-gradient(rgba(10,19,48,.55),rgba(10,19,48,.85)),url(/img/login-bg.jpg) center/cover no-repeat}
.authscene.photo svg{display:none}
.authbg .auth .logo h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.authbg .auth .logo p{color:#e2e8ff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.acard{background:var(--card);border-radius:22px;padding:14px 16px 16px;box-shadow:var(--sh)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ft{background:rgba(10,19,48,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 8px 12px;color:#fff;text-align:center}
.ft svg{width:76px;height:46px;display:block;margin:0 auto 4px}
.ft b{display:block;font-size:14px}.ft small{display:block;color:#cdd6f6;font-size:12px;line-height:1.3;margin-top:2px}
</style></head><body>

    return h+`<div class="c"><div class="row between"><b>${sv.i} ${sv.n}</b><span class="tag ${ride.status=="progress"?"ok":""}">${ride.status=="accepted"?"Go to pickup":"Trip in progress"}</span></div>${ride.details?`<p class="mu" style="margin-top:4px">${esc(ride.details)}</p>`:""}

    <button class="btn pr big" data-a="st" data-v="${ride.status=="accepted"?"progress":"done"}">${ride.status=="accepted"?"Passenger picked up":"Complete ride"}</button></div>`}
  return h+svBox()+`<h3 style="margin-top:6px">Requests (${open.length})</h3>`+(open.map((r,i)=>`<div class="req"><div class="row between"><b>${svn(r.service).i} ${svn(r.service).n}</b><b class="big2">${money(r.price)}</b></div>${r.details?`<p class="mu">${esc(r.details)}</p>`:""}
    <div style="margin:10px 0">${routeBox(r)}</div><p class="mu">${fmtDist(r.km)} · ${r.payment=="ecocash"?"📱 EcoCash":"💵 Cash"}</p>

function hdr(t,back=true){return `<div class="ph">${back?`<button class="back" data-a="back" aria-label="Back">←</button>`:""}<h2>${t}</h2></div><div class="pin">`}

function histPage(){const r=role(),isP=r=="passenger";
  let list=hist.filter(x=>filt=="all"||(filt=="city"?(x.service||"taxi")=="taxi":(x.service||"taxi")!="taxi"));

function safetyPage(){const ec=LS.g("ec",[]);

function settingsPage(){return hdr("Settings")+`<div class="c"><b>Appearance</b>${segs("theme",set.theme,[["system","System"],["light","Light"],["dark","Dark"]])}</div>

function helpPage(){const f=[["How is the price set?","You choose your offer. We show a suggested price based on distance and the service. Drivers can accept your offer if it works for them."],["How do I pay?","Pay your driver in cash, or choose EcoCash and pay after the trip."],["What can I book?","Taxi rides, pickup trucks, heavy trucks and haulage, and equipment with crew."],["How do I become a driver?","Sign up and choose Drive & earn. Upload your ID, licence, selfie and vehicle photo. After checks, you will be approved."],["What does HaulGo charge?","Drivers keep 90% of each fare. HaulGo keeps 10%."],["Something went wrong on a trip","Use the Safety page for emergencies. For other problems, contact support."]];

function adminPage(){const d=all.filter(x=>x.status=="done"),g=d.reduce((s,x)=>s+ +x.price,0),c=d.reduce((s,x)=>s+ +x.commission,0),pend=drivers.filter(x=>!x.approved).length;
  let b="";
  if(atab=="over")b=`<div class="row" style="margin:6px 0"><div class="stat"><small>Your commission (10%)</small><b>${money(c)}</b></div><div class="stat"><small>Gross rides</small><b>${money(g)}</b></div></div><div class="row"><div class="stat"><small>Completed rides</small><b>${d.length}</b></div><div class="stat"><small>Drivers pending</small><b>${pend}</b></div></div>`;

    <div class="row" style="margin-top:8px"><button class="btn" data-a="docs" data-v="${x.id}">Documents</button><button class="btn ${x.approved?"bad":"pr"}" data-a="ap" data-v="${x.id}" data-v2="${x.approved?0:1}">${x.approved?"Suspend":"Approve"}</button></div></div>`).join("")||`<p class="mu center" style="padding:30px">No drivers yet.</p>`;

  return `<div class="ph"><button class="back" data-a="menu" aria-label="Menu">☰</button><h2>Super user</h2></div><div class="pin">${segs("atab",atab,[["over","Overview"],["drv","Drivers"],["rides","Rides"]])}${b}</div>`}
function drawerHTML(){const r=role(),adm=prof.role=="admin",nm=esc(prof.name||"You");

  <div class="dn">${items.map(([k,ic,t])=>`<button class="di ${cur==k?"on":""}" data-a="nav" data-v="${k}"><i>${ic}</i>${t}</button>`).join("")}

// ---------- docs verification (driver + admin) ----------
function shrink(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("Image problem")),"image/jpeg",0.85)};i.onerror=()=>no(new Error("Could not read photo"));i.src=URL.createObjectURL(f)})}
async function runAI(id){try{const{data:{session}}=await sb.auth.getSession();const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify(id?{driver_id:id}:{})});return await r.json()}catch(e){return null}}
const rep=d=>{const a=d.ai_report;return `<div style="background:#16275c;color:#fff;border-radius:14px;padding:12px;margin:8px 0"><b>AI check: ${d.ai_status||"not run"}</b> <button class="btn sm" id="rr">${a?"Run again":"Run AI check"}</button>`+(a?`<p>${esc(a.summary)}</p><ul>`+(a.checks||[]).map(c=>`<li>${c.ok===true?"✅":c.ok===false?"❌":"⚠️"} ${esc(c.name)}: ${esc(c.note)}</li>`).join("")+"</ul>":"")+`<p style="font-size:12px;opacity:.7">AI assists only. It does not match faces. Compare the selfie and ID yourself before approving.</p></div>`};
async function submitDocs(){const g=i=>$(i),m=g("vmsg");
 const v={id:g("vid").value.trim(),pl:g("vpl").value.trim(),car:g("vcar").value.trim()},fs=[1,2,3,4].map(i=>g("f"+i).files[0]),svs=[...document.querySelectorAll("[data-vs]")].filter(c=>c.checked).map(c=>c.dataset.vs);
 if(!v.id||!v.pl||!v.car||fs.some(f=>!f))return m.textContent="Please fill every box and add all 4 photos.";
 if(fs.some(f=>f.size>10e6))return m.textContent="Each photo must be under 10 MB.";
 g("vsub").disabled=true;m.textContent="Uploading, please wait…";
 try{const k=["id","licence","selfie","car"],paths=[];
  for(let i=0;i<4;i++){const p=`${me.id}/${Date.now()}-${k[i]}.jpg`;const bl=await shrink(fs[i]);const{error}=await sb.storage.from("driver-docs").upload(p,bl,{contentType:"image/jpeg"});if(error)throw error;paths.push(p)}
  const{error}=await sb.rpc("submit_driver_docs",{p_id_number:v.id,p_plate:v.pl,p_car:v.car,p_id_path:paths[0],p_licence_path:paths[1],p_selfie_path:paths[2],p_car_path:paths[3]});
  if(error)throw error;
  await sb.rpc("set_my_services",{p_services:svs.length?svs:["taxi"]});m.textContent="Checking your documents (up to a minute)…";await runAI();
  prof=(await sb.from("profiles").select("*").eq("id",me.id).single()).data;view()
 }catch(e){m.textContent="Could not submit: "+e.message;g("vsub").disabled=false}}
async function showDocs(id){const{data:d}=await sb.from("driver_docs").select("*").eq("driver_id",id).maybeSingle();if(!d)return alert("This driver has not uploaded documents yet.");
 const{data:u}=await sb.storage.from("driver-docs").createSignedUrls([d.id_path,d.licence_path,d.selfie_path,d.car_path],300);
 const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.9);overflow:auto;padding:20px;z-index:2800";
 o.innerHTML=`<div style="max-width:700px;margin:auto"><button class="btn" id="xc">Close</button><p style="color:#fff">ID number: ${esc(d.id_number)} · Plate: ${esc(d.plate)} · ${esc(d.car_model)}</p>${rep(d)}`+(u||[]).map(x=>`<img src="${x.signedUrl}" style="width:100%;margin:6px 0;border-radius:10px">`).join("")+`</div>`;
 document.body.appendChild(o);o.querySelector("#xc").onclick=()=>o.remove();o.querySelector("#rr").onclick=async()=>{o.querySelector("#rr").textContent="Checking…";await runAI(id);o.remove();showDocs(id)}}

// ---------- after render: inputs ----------
function wireSearch(){const q=$("q"),sg=$("sug");if(!q)return;let items=[];
  const webSearch=async t=>{q.disabled=true;const r=(await search(t).catch(()=>[]))[0];q.disabled=false;if(!r){q.value="";q.placeholder="Not found. Try another name or tap the map";return}await setPlace({lat:+r.lat,lng:+r.lon,name:esc(r.display_name.split(",").slice(0,2).join(","))})};
  const render=()=>{const t=q.value.trim();items=[];
    if(!t){if(!pick)items.push({ic:"📍",t:"Use my current location",f:useGps});
      if(recents.length){items.push({h:"Recent"});recents.slice(0,innerWidth<900?2:4).forEach(x=>items.push({ic:"🕘",t:x.name,f:()=>setPlace(x)}))}items.push({h:"Popular places"})}
    suggest(t).slice(0,t||innerWidth>=900?6:4).forEach(x=>items.push({ic:"📍",t:x[0],f:()=>setPlace({lat:x[1],lng:x[2],name:esc(x[0])})}));
    if(t)items.push({ic:"🔎",t:`Search more places for "${esc(t)}"`,f:()=>webSearch(t)});
    sg.innerHTML=items.map((x,i)=>x.h?`<div class="hd">${x.h}</div>`:`<div class="sg" data-i="${i}"><i>${x.ic}</i><div><b>${x.t}</b></div></div>`).join("");
    sg.querySelectorAll(".sg").forEach(d=>d.onclick=()=>items[+d.dataset.i].f())};
  q.oninput=render;render();
  q.onkeydown=e=>{if(e.key!="Enter")return;const t=q.value.trim();if(!t)return;const m=suggest(t)[0];if(m)setPlace({lat:m[1],lng:m[2],name:esc(m[0])});else webSearch(t)}}
function afterRender(){wireSearch();haulieUI();
  const dt=$("dt");if(dt)dt.oninput=e=>{details=e.target.value.replace(/"/g,"'")};
  const on=$("on");if(on)on.onchange=e=>{if(e.target.checked){if(!navigator.geolocation){e.target.checked=false;return alert("Location is not available on this device")}
      watch=navigator.geolocation.watchPosition(p=>{if(Date.now()-lastPush<5000)return;lastPush=Date.now();sb.from("driver_locations").upsert({driver_id:me.id,lat:p.coords.latitude,lng:p.coords.longitude,updated_at:new Date().toISOString()})},()=>alert("Allow location access"),{enableHighAccuracy:true})}
    else{navigator.geolocation.clearWatch(watch);watch=null}view()}}

// HAULIE: talking cartoon driver, trip announcements and voice ordering
// =====================================================================
const SPEAK=!!window.speechSynthesis, SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const H={gen:0,chain:Promise.resolve(),speaking:false,last:0,hideT:0,st:LS.g("hs",{}),dk:null,hi:0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const hfEl=()=>$("hface"),hbEl=()=>$("hbub");
const VBTN=`<button class="btn big" style="margin-top:0;margin-bottom:10px" data-a="voice">🎤 Just say it: book by voice</button>`;

// ---------- content ----------
const JOKES=["Why did the taxi driver get a medal? Because he always went the extra mile!","What do you call a sleeping truck? A bulldozer!","Why was the sadza so confident? It always knew how to stick around.","I told my GPS I'd like to avoid traffic. It said: then maybe don't drive on a Friday afternoon.","Why don't trucks ever get lost? They always know the load way home.","What did the road say to the car? Don't worry, I've got you covered.","Why did the bricks stay calm on the pickup? Because they were well stacked!","What is a driver's favourite kind of music? Anything with a good road beat."];
const FACTS=["Harare sits about 1,490 metres above sea level, so it is cooler than you would expect for the tropics.","Harare used to be called Salisbury. It was renamed Harare in 1982.","Every October the jacaranda trees along Harare's streets bloom purple.","The name Zimbabwe comes from dzimba dzemabwe, which means houses of stone, a reference to Great Zimbabwe.","Victoria Falls is known locally as Mosi-oa-Tunya, the smoke that thunders.","Zimbabwe has 16 official languages, including Shona, Ndebele and English.","The mbira, or thumb piano, is one of Zimbabwe's best loved instruments.","Harare is often called the Sunshine City.","Mbare Musika is one of the best known and busiest markets in the country."];
const RID=[["What has wheels and flies?","A rubbish truck!"],["What gets wetter the more it dries?","A towel."],["What has a face and two hands, but no arms or legs?","A clock."],["The more you take, the more you leave behind. What am I?","Footsteps."],["What has keys but cannot open a single lock?","A piano."],["What can you catch but not throw?","A cold."]];
const SHONA=[["Mhoro","hello"],["Ndatenda","thank you"],["Makadii","how are you"],["Ndiripo","I am fine"],["Hongu","yes"],["Kwete","no"],["Mvura","water"],["Kumba","home"],["Mari","money"],["Rudo","love"],["Zvakanaka","it is good"],["Mota","car"],["Imba","house"],["Chikafu","food"]];

// ---------- face and speech ----------
function hMode(m){const f=hfEl();if(!f)return;f.classList.toggle("talk",m=="talk");f.classList.toggle("think",m=="think")}
function hCaption(t,menu){const b=hbEl();if(!b)return;clearTimeout(H.hideT);b.innerHTML=`<span>${esc(t)}</span>`+(menu||"");b.classList.add("on")}
function hHide(ms){clearTimeout(H.hideT);H.hideT=setTimeout(()=>{const b=hbEl();if(b)b.classList.remove("on")},ms)}
function pickVoice(){if(!SPEAK)return null;const v=speechSynthesis.getVoices();return v.find(x=>/^en[-_](ZA|ZW)/i.test(x.lang))||v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
function speakNow(text){return new Promise(res=>{let done=0,tm;
  const fin=()=>{if(done)return;done=1;clearTimeout(tm);H.speaking=false;H.last=Date.now();hMode("");hHide(4500);res()};
  hCaption(text);hMode("talk");H.speaking=true;
  const est=Math.max(1800,text.split(/\s+/).length*380);
  const live=SPEAK&&set.voice;
  tm=setTimeout(fin,live?est*2+3000:est);
  if(live){try{const u=new SpeechSynthesisUtterance(text),v=pickVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=1;u.pitch=1.15;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}}})}
function say(text,o={}){if(o.urgent){H.gen++;if(SPEAK)try{speechSynthesis.cancel()}catch(e){}}
  const g=H.gen;H.chain=H.chain.then(()=>g!==H.gen?null:speakNow(text)).catch(()=>{});return H.chain}
// phones only allow speech after a tap, so unlock it on the first touch
addEventListener("pointerdown",()=>{if(SPEAK)try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true});
if(SPEAK)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

// ---------- entertainment ----------
const joke=()=>say(rnd(JOKES),{urgent:true});
const fact=()=>say("Did you know? "+rnd(FACTS),{urgent:true});
async function riddle(){const r=rnd(RID);await say("Riddle time! "+r[0]+" I'll tell you the answer in a moment.",{urgent:true});const g=H.gen;await sleep(7000);if(g===H.gen)say("The answer is: "+r[1])}
function shona(){const w=SHONA[Math.floor(Date.now()/864e5)%SHONA.length];say(`Shona word of the day: ${w[0]}. It means ${w[1]}.`,{urgent:true})}
const entertain=()=>rnd([joke,fact,riddle,shona])();
setInterval(()=>{if(!prof||role()!="passenger"||!ride||!set.fun||H.speaking||VO.open)return;
  if(!["requested","accepted","progress"].includes(ride.status))return;if(Date.now()-H.last<75000)return;entertain()},15000);

// ---------- trip announcements ----------
function spokenDist(km){if(set.units=="mi"){const m=km*0.621371;return m<0.2?"less than a quarter of a mile":m.toFixed(1)+" miles"}
  return km<1?Math.max(100,Math.round(km*10)*100)+" metres":km.toFixed(1)+" kilometres"}
const hSave=()=>LS.s("hs",H.st);
function haulieRide(){if(!ride||!set.ann)return;const r=ride;if(H.st.id!=r.id){H.st={id:r.id};hSave()}
  const s=H.st,d=r.d||{},who=(d.name||"Your driver").trim().split(" ")[0];
  if(r.status=="requested"&&!s.rq){s.rq=1;hSave();say("Your request is live. I'm looking for a driver near you. Hang tight!",{urgent:true})}
  if(r.status=="accepted"&&!s.ac){s.ac=1;hSave();say(`Good news! ${who} has accepted your request. They're in a ${d.car||"vehicle"}, number plate ${d.plate||"shown on screen"}. I'll keep you posted on how far they are.`,{urgent:true})}
  if(r.status=="progress"&&!s.pg){s.pg=1;hSave();say(`${who} has picked you up and your trip to ${r.drop_name} has started. Sit back and relax. Tap my face anytime for a joke or a fun fact.`,{urgent:true})}
  if(r.status=="done"&&!s.dn){s.dn=1;hSave();say(`You've arrived at ${r.drop_name}. Ndatenda, thank you for riding with HaulGo! Please rate your driver.`,{urgent:true})}}
function haulieDist(km){if(!ride||ride.status!="accepted"||!set.ann||H.st.id!=ride.id)return;
  const s=H.st,d=ride.d||{},who=(d.name||"Your driver").trim().split(" ")[0],now=Date.now();
  if(km<=0.08){if(!s.ar){s.ar=1;hSave();say(`${who} has arrived! Look out for the ${d.car||"vehicle"}, plate ${d.plate||""}.`,{urgent:true})}return}
  if(km<0.35){if(!s.al){s.al=1;hSave();say(`${who} is almost there!`,{urgent:true})}return}
  if(!H.dk||H.dk.id!=ride.id)H.dk={id:ride.id,km:null,at:0};
  if(H.dk.km==null||(now-H.dk.at>60000&&Math.abs(H.dk.km-km)>=0.2)){
    const mn=Math.max(1,Math.round(km/25*60));H.dk.km=km;H.dk.at=now;
    say(`${who} is about ${spokenDist(km)} away, around ${mn} ${mn==1?"minute":"minutes"}.`)}}
function haulieUI(){const on=!!prof&&role()=="passenger"&&!pg,h=$("haulie"),m=document.querySelector(".fab.mic");
  if(h)h.style.display=on?"flex":"none";if(m)m.style.display=(on&&!ride)?"":"none";
  if(on&&!H.hi){H.hi=1;setTimeout(()=>{if(!ride&&!VO.open){hCaption("Mhoro! I'm Haulie. Tap the 🎤 and tell me where you're going.");hHide(7000)}},1200)}}

// ---------- voice ordering ----------
const VO={open:false,st:"idle",txt:"",msg:"",rec:null,tok:0};
const stopRec=()=>{try{VO.rec&&VO.rec.abort()}catch(e){}VO.rec=null};
function recognise(onI){return new Promise((res,rej)=>{const r=new SR();VO.rec=r;r.lang="en-ZA";r.interimResults=true;r.maxAlternatives=1;let last="";
  r.onresult=e=>{let f="",i="";for(let k=0;k<e.results.length;k++){const x=e.results[k];if(x.isFinal)f+=x[0].transcript+" ";else i+=x[0].transcript}last=(f+i).trim();onI&&onI(last)};
  r.onerror=e=>{VO.rec=null;if(e.error=="no-speech"||e.error=="aborted")res(last);else rej(new Error(e.error))};
  r.onend=()=>{VO.rec=null;res(last)};
  try{r.start()}catch(e){rej(e)}})}
function voRender(){const p=$("vo");if(!p)return;if(!VO.open){p.style.display="none";p.innerHTML="";return}
  p.style.display="block";let b=`<div class="row between"><h2>🎤 Talk to Haulie</h2><button class="btn sm fx" data-a="voclose" aria-label="Close">✕</button></div>`;
  const typed=`<div class="row" style="margin-top:12px"><input class="in" id="vt" placeholder="…or type it here" autocomplete="off"><button class="btn pr fx" data-a="vosend">Send</button></div>`;
  const hint=`<p class="mu" style="margin-top:6px">Try: “Pickup truck from Avondale to Mbare Musika, 2 tonnes of bricks, I'll pay 15 dollars”</p>`;
  if(VO.st=="listen")b+=`<div class="center" style="margin-top:10px"><button class="micbig on" data-a="vostop" aria-label="Stop listening">🎤</button><p class="mu" style="margin-top:8px">Listening… tap when you're done</p><p class="vtx" id="vtx">${esc(VO.txt)}</p></div>`+typed+hint;
  else if(VO.st=="think")b+=`<div class="center" style="margin:18px 0"><div style="font-size:40px">🤔</div><p class="vtx">“${esc(VO.txt)}”</p><p class="mu">Understanding your request…</p></div>`;
  else if(VO.st=="confirm"){b+=`<p class="mu" style="margin:8px 0">“${esc(VO.txt)}”</p><div class="c"><div class="row between"><b>${svn(svc).i} ${svn(svc).n}</b><b class="big2">${money(offer)}</b></div>${svc!="taxi"&&details?`<p class="mu">${esc(details)}</p>`:""}<div style="margin:10px 0">${routeBox({pickup_name:pick.name,drop_name:drop.name})}</div><p class="mu">${fmtDist(est.km)} · ${pay=="ecocash"?"📱 EcoCash":"💵 Cash"}</p></div>`
    +(set.auto?`<p class="center mu">Auto-book is on, booking now…</p>`:`<div class="row"><button class="btn" data-a="vocancel">Cancel</button><button class="btn pr" data-a="voconfirm">✅ Book it</button></div><p class="center mu" style="margin-top:8px">You can also say “yes” or “no”.</p>`)}
  else if(VO.st=="booked")b+=`<div class="center" style="margin:22px 0"><div style="font-size:40px">🚚</div><p class="mu">Sending your request…</p></div>`;
  else b+=`<div class="center" style="margin-top:10px"><button class="micbig" data-a="voagain" aria-label="Start talking">🎤</button><p class="mu" style="margin-top:8px">${esc(VO.msg||"Tap the mic and tell me what you need.")}</p></div>`+typed+hint;
  p.innerHTML=b;const vt=$("vt");if(vt)vt.onkeydown=e=>{if(e.key=="Enter")A.vosend()}}
function voOpen(){if(ride)return;VO.open=true;VO.st="idle";VO.txt="";VO.msg="";voRender();voListen()}
function voClose(){VO.open=false;VO.tok++;stopRec();if(SPEAK)try{speechSynthesis.cancel()}catch(e){}H.gen++;hMode("");voRender()}
async function voListen(){if(!SR){VO.st="idle";VO.msg="Voice input isn't supported in this browser. Type your request below.";voRender();return}
  const tok=++VO.tok;if(SPEAK)try{speechSynthesis.cancel()}catch(e){}H.gen++;stopRec();
  VO.st="listen";VO.txt="";voRender();hCaption("I'm listening…");hMode("");
  try{const t=await recognise(x=>{VO.txt=x;const e=$("vtx");if(e)e.textContent=x});
    if(tok!==VO.tok||!VO.open)return;
    if(!t){VO.st="idle";VO.msg="I didn't hear anything. Tap the mic and try again.";voRender();return}
    voProcess(t)}
  catch(e){if(tok!==VO.tok||!VO.open)return;VO.st="idle";VO.msg=/not-allowed|service-not-allowed/.test(e.message)?"Please allow microphone access, or type your request below.":"I couldn't hear that. Tap the mic to try again, or type it below.";voRender()}}
function logVoice(x){const l=LS.g("vlog",[]);l.unshift({t:Date.now(),x});LS.s("vlog",l.slice(0,20))}
async function aiParse(text){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
  try{const{data:{session}}=await sb.auth.getSession();
    const r=await fetch("/api/voice",{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+(session?session.access_token:"")},body:JSON.stringify({text,places:PLACES.map(p=>p[0])})});
    if(!r.ok)throw new Error("voice api "+r.status);return (await r.json()).order||null}finally{clearTimeout(to)}}
function localParse(t){
  const s=" "+String(t||"").toLowerCase().replace(/[.,!?;:]/g," ").replace(/\s+/g," ")+" ";
  const o={service:"taxi",pickup:null,pickup_here:false,drop:null,details:null,offer:null,payment:null};
  const pm=s.match(/(?:\$|usd\s*)\s*(\d+(?:\.\d+)?)/)||s.match(/(\d+(?:\.\d+)?)\s*(?:dollars?|bucks|usd)\b/)||s.match(/\b(?:pay|paying|offer)\s+(\d+(?:\.\d+)?)\b(?!\s*(?:tonnes?|tons?|kgs?|helpers?|people|passengers?|workers?))/);
  if(pm)o.offer=+pm[1];
  if(/ecocash|eco cash/.test(s))o.payment="ecocash";else if(/\bcash\b/.test(s))o.payment="cash";
  if(/\bpickup\b|\bpick ?up (?:truck|van)\b|\bbakkie\b/.test(s))o.service="pickup";
  else if(/\bheavy\b|\blorry\b|\bhaulage\b|\btrailer\b|\bsemi\b/.test(s))o.service="heavy";
  else if(/\bcrew\b|\bmovers?\b|\bhelpers?\b|\blabou?rers?\b|\bloaders?\b|\bexcavator\b|\bhire\b/.test(s))o.service="crew";
  else if(/\btruck\b|\bbricks?\b|\bcement\b|\bfurniture\b|\btonnes?\b|\btons?\b|\bsand\b|\bgoods\b|\bdeliver/.test(s))o.service="pickup";
  const dl=[],m1=s.match(/(\d+(?:\.\d+)?\s*(?:tonnes?|tons?|kgs?)(?:\s+of\s+[a-z]+)?)/),m2=s.match(/(\d+\s*(?:helpers?|workers?|movers?|loaders?|labou?rers?))\b/);
  if(m1)dl.push(m1[1].trim());if(m2)dl.push(m2[1].trim());o.details=dl.join(", ")||null;
  let c=s.replace(/(?:\$|usd\s*)\s*\d+(?:\.\d+)?/g," ").replace(/\d+(?:\.\d+)?\s*(?:dollars?|bucks|usd)\b/g," ").replace(/\b(?:i(?:'ll| will)?\s+pay|paying|pay|offer)\s+\d+(?:\.\d+)?/g," ")
    .replace(/\d+(?:\.\d+)?\s*(?:tonnes?|tons?|kgs?)(?:\s+of\s+[a-z]+)?/g," ").replace(/\d+\s*(?:helpers?|workers?|movers?|loaders?|labou?rers?)/g," ").replace(/\s+/g," ");
  const FR="(?:from|pick me up (?:at|from)|kubva(?:\\s+(?:ku|kuna))?)",TO="(?:to|kuenda(?:\\s+(?:ku|kuna))?|going to|ndiri kuenda ku)";
  const cl=x=>{x=(x||"").split(/\s+(?:and|with|please|i|for|ndinoda|ndichabhadhara|carrying|need|want)\b/)[0].replace(/^(?:the|a|my|at|ku|kuna)\s+/,"").trim();return x||null};
  const a=c.match(new RegExp("\\b"+FR+"\\s+(.+?)\\s+\\b"+TO+"\\s+(.+)"));
  if(a){o.pickup=cl(a[1]);o.drop=cl(a[2])}else{const b=c.match(new RegExp("\\b"+TO+"\\s+(.+)"));if(b)o.drop=cl(b[1])}
  if(!o.pickup||/^(?:here|my (?:location|place)|where i am|current location|me)$/.test(o.pickup)){o.pickup=null;o.pickup_here=true}
  return o}
async function resolvePlace(q){q=(q||"").replace(/[^\w\s'\-\/]/g," ").replace(/\s+/g," ").trim().replace(/^(?:the|a|my|at|ku|kuna)\s+/i,"");if(!q)return null;
  const words=q.toLowerCase().split(" ").filter(w=>w.length>2&&!["the","shops","area","near","road","street","please","avenue"].includes(w));
  let m=suggest(q)[0];
  if(!m&&words.length){let best=null,bs=0;PLACES.forEach(p=>{const hay=(p[0]+" "+(p[3]||"")).toLowerCase(),n=words.filter(w=>hay.includes(w)).length,sc=n/words.length;if(n&&sc>bs){bs=sc;best=p}});if(bs>=0.5)m=best}
  if(m)return{lat:m[1],lng:m[2],name:esc(m[0])};
  try{const r=(await search(q))[0];if(r)return{lat:+r.lat,lng:+r.lon,name:esc(r.display_name.split(",").slice(0,2).join(","))}}catch(e){}
  return null}
function gpsPlace(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(async p=>{const ll={lat:p.coords.latitude,lng:p.coords.longitude};res({...ll,name:await rev(ll)})},()=>res(null),{timeout:8000,maximumAge:60000})})}
async function voProcess(text){VO.st="think";VO.txt=text;voRender();hMode("think");hCaption("Hmm, let me think…");logVoice(text);
  let o=null;try{o=await aiParse(text)}catch(e){}
  if(!o||!o.drop)o=localParse(text);
  hMode("");await voBuild(o)}
async function voBuild(o){
  const fail=(msg,sp)=>{VO.st="idle";VO.msg=msg;voRender();say(sp||msg,{urgent:true})};
  if(!o||!o.drop)return fail("Sorry, I didn't catch where you're going. Try: “Taxi from Avondale to the airport”.","Sorry, I didn't catch where you're going. Please try again.");
  hCaption("Finding the places…");hMode("think");
  svc=SV[o.service]?o.service:"taxi";
  let pk=null;if(o.pickup&&!o.pickup_here)pk=await resolvePlace(o.pickup);
  if(!pk&&(o.pickup_here||!o.pickup))pk=pick||await gpsPlace();
  const dp=await resolvePlace(o.drop);hMode("");
  if(!dp)return fail(`I couldn't find “${o.drop}”. Try another name or type it below.`,`Sorry, I couldn't find ${o.drop}. Please try another name.`);
  if(!pk)return fail("I couldn't work out your pickup. Allow location access, or say it like “from Avondale”.","I couldn't work out where to pick you up. Please say the pickup place, or allow location access.");
  pick=pk;drop=dp;est=null;details=(o.details||"").replace(/"/g,"'");pay=o.payment=="ecocash"?"ecocash":"cash";
  await draw();if(!est)return fail("I couldn't price that trip. Please try again.");
  if(+o.offer>0)offer=+(+o.offer).toFixed(2);
  VO.st="confirm";view();voRender();
  const sv=svn(svc),line=`${sv.n} from ${pick.name} to ${drop.name}, about ${spokenDist(est.km)}${svc!="taxi"&&details?", carrying "+details:""}. Your offer is ${offer} dollars, paying ${pay=="ecocash"?"by EcoCash":"cash"}.`;
  if(set.auto){await say(line+" Booking it now!",{urgent:true});if(VO.open&&VO.st=="confirm")voBook();return}
  await say(line+" Shall I book it? Say yes, or tap Book it.",{urgent:true});
  if(VO.open&&VO.st=="confirm"&&SR){try{hCaption("Listening for yes or no…");const a=await recognise();
    if(VO.open&&VO.st=="confirm"){const no=/\b(no|nope|cancel|stop|kwete|don'?t)\b/i.test(a),yes=/\b(yes|yeah|yep|ok|okay|sure|book|confirm|go|hongu|ehe)\b/i.test(a);if(yes&&!no)voBook();else if(no)voCancel()}}catch(e){}}}
async function voBook(){if(VO.st!="confirm")return;stopRec();VO.st="booked";voRender();const said=VO.txt;await A.go();VO.open=false;VO.tok++;voRender();saveVoiceText(said)}
// stores what the passenger said on the new ride (needs the voice_text column; silently skipped if it is missing)
async function saveVoiceText(x){try{if(!x||!me)return;await sleep(1500);
  const{data}=await sb.from("rides").select("id").eq("passenger_id",me.id).order("created_at",{ascending:false}).limit(1);
  if(data&&data[0])await sb.from("rides").update({voice_text:String(x).slice(0,500)}).eq("id",data[0].id)}catch(e){}}
function voCancel(){stopRec();pick=drop=est=null;grp.clearLayers();view();VO.st="idle";VO.msg="Cancelled. Tap the mic to try again.";voRender();say("No problem, cancelled.",{urgent:true})}

});
