<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #5d6572;
    --line: #d6dae1; --accent: #1f5fd1; --error: #b3261e; --ok: #1b7a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2026; --text: #eceef2; --muted: #9aa2af;
      --line: #343944; --accent: #6b9cf5; --error: #ff8a80; --ok: #6fd08c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  main {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 28px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
  label { display: block; font-size: .9rem; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0d1117; } }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #msg { margin-top: 14px; min-height: 1.3em; font-size: .92rem; }
  #msg.error { color: var(--error); }
  #msg.ok { color: var(--ok); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Set a new password</h1>
  <p class="sub" id="sub">Checking your reset link…</p>

  <div id="formWrap" class="hidden">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8">
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8">
    <button id="save">Save new password</button>
  </div>

  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // 1. Paste your project values (Supabase → Project Settings → API)
  const SUPABASE_URL = "https://strvlhdnrmdnfvieepzh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_mCQrObUp4aejmPm3VtQ_oA_TrFCxoWN";

  // 2. Where to send the user after the password is saved
  const AFTER_SUCCESS_URL = "/"; // e.g. "/login"

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);

  function show(text, type) {
    $("msg").textContent = text;
    $("msg").className = type || "";
  }

  function showForm() {
    $("sub").textContent = "Choose a password with at least 8 characters.";
    $("formWrap").classList.remove("hidden");
    show("");
  }

  // The recovery link signs the user in and fires PASSWORD_RECOVERY
  db.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") showForm();
  });

  // If the page loaded with a valid session already, show the form too
  setTimeout(async () => {
    if ($("formWrap").classList.contains("hidden")) {
      const { data } = await db.auth.getSession();
      if (data.session) showForm();
      else {
        $("sub").textContent = "This reset link is invalid or has expired.";
        show("Request a new password reset email and open the newest link.", "error");
      }
    }
  }, 1500);

  $("save").addEventListener("click", async () => {
    const pw = $("pw").value;
    const pw2 = $("pw2").value;
    if (pw.length < 8) return show("Password must be at least 8 characters.", "error");
    if (pw !== pw2) return show("The two passwords don't match.", "error");

    $("save").disabled = true;
    show("Saving…");
    const { error } = await db.auth.updateUser({ password: pw });
    if (error) {
      $("save").disabled = false;
      return show(error.message, "error");
    }
    show("Password saved. Redirecting…", "ok");
    await db.auth.signOut();
    setTimeout(() => { window.location.href = AFTER_SUCCESS_URL; }, 1500);
  });
</script>
</body>
</html>
