<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HaulGo</title>
<meta name="theme-color" content="#0a1330">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HaulGo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#0d1530;--mu:#6a7595;--ln:#e3e8f3;--pr:#f97316;--pr2:#ea580c;--nv:#0a1330;--ok:#16a34a;--bad:#e11d48;--sh:0 10px 40px rgba(10,19,48,.18)}
html[data-th=dark]{--bg:#080e22;--card:#111b3a;--tx:#eef2ff;--mu:#9aa7c9;--ln:#23315e;--sh:0 10px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
h1,h2,h3,p{margin:0}
#map{position:fixed;inset:0;z-index:0}
html[data-th=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.75)}
.leaflet-control-attribution{font-size:10px}
.topbar{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:1300;display:flex;gap:10px;align-items:center}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--tx);box-shadow:var(--sh);font-size:19px;padding:0;cursor:pointer;display:grid;place-items:center}
.fab.loc{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:1300;color:var(--pr)}
.pill{background:var(--nv);color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;box-shadow:var(--sh);letter-spacing:-.3px}.pill b{color:var(--pr)}
.sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-height:68vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;box-shadow:var(--sh);padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 12px}
@media(min-width:900px){.sheet{left:20px;right:auto;top:76px;bottom:20px;width:410px;max-height:none;border-radius:24px;padding-top:18px}.sheet:before{display:none}}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px}h3{font-size:16px;font-weight:700}
.mu{color:var(--mu);font-size:13px}.cred{color:var(--mu);font-size:11px;text-align:center;margin-top:14px}
.btn{font:inherit;font-weight:600;padding:12px 16px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn{white-space:nowrap}.row .btn{padding:12px 8px}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.pr{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(249,115,22,.35)}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:10px}
.btn.bad{background:rgba(225,29,72,.1);color:var(--bad);border-color:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.between{justify-content:space-between}.row .fx{flex:0 0 auto}
.in{width:100%;padding:12px 13px;border:1px solid var(--ln);border-radius:13px;background:var(--bg);color:var(--tx);font:inherit;margin:5px 0;outline:none}
.in:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:78px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:16px;padding:8px 10px;text-align:center;font:inherit;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.chip span{font-size:26px;line-height:1.15}.chip.on{background:rgba(249,115,22,.14);border-color:var(--pr);font-weight:700}
.srch{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:0 14px}
.srch input{border:0;background:transparent;margin:0;padding:15px 0;font:inherit;font-size:16px;color:var(--tx);outline:none;width:100%}
.srch:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.sg{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.sg i{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal;flex:0 0 auto}
.sg small{display:block;color:var(--mu)}
.hd{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--mu);margin:14px 0 2px;text-transform:uppercase}
.pk{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:10px}.pk span{flex:1;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}.dot.b{background:#3b82f6}.dot.o{background:var(--pr)}
.trip{display:flex;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
.rt{display:flex;flex-direction:column;align-items:center;padding:6px 0}.rt u{flex:1;width:2px;background:var(--ln);margin:3px 0;min-height:18px}
.stops{flex:1;min-width:0}.st{padding:4px 0;cursor:pointer}.st small{display:block;color:var(--mu);font-size:12px}.st b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st+.st{border-top:1px solid var(--ln);margin-top:4px;padding-top:8px}
.meta{margin:12px 2px 4px;color:var(--mu)}
.price{display:flex;align-items:center;gap:10px;margin:12px 0}.price>div{flex:1;text-align:center}.price b{display:block;font-size:30px;letter-spacing:-1px}.price small{color:var(--mu)}
.price button{width:54px;height:54px;border-radius:16px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:26px;cursor:pointer;flex:0 0 auto}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;margin:6px 0}.seg button{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-weight:600;padding:10px;border-radius:11px;cursor:pointer}.seg button.on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--pr2)}
.radar{position:relative;width:150px;height:150px;margin:8px auto 14px;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pr);opacity:0;animation:rd 2.4s infinite}.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
.radar span{font-size:46px;position:relative}@keyframes rd{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
.center{text-align:center}
.tl{display:flex;gap:6px;margin:12px 0 4px}.tl div{flex:1;height:5px;border-radius:9px;background:var(--ln)}.tl .d{background:var(--pr)}
.tlt{display:flex;justify-content:space-between;color:var(--mu);font-size:11.5px}
.drv{display:flex;gap:12px;align-items:center;margin:12px 0}.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#16275c,#0a1330);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:0 0 auto}
.plate{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:1px 8px;font-weight:700;letter-spacing:1px}
.big2{font-size:26px;font-weight:800;color:var(--pr);letter-spacing:-.5px}
.stars{display:flex;justify-content:center;gap:2px}.stars button{font-size:34px;background:none;border:0;padding:2px;color:#f59e0b;cursor:pointer}
.sw{position:relative;width:58px;height:34px;flex:0 0 auto}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--ln);border-radius:99px;transition:.2s}.sw span:after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:after{left:28px}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px}.pin .stat{background:var(--card);border:1px solid var(--ln)}.stat small{color:var(--mu);display:block}.stat b{font-size:22px;letter-spacing:-.5px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:10px 0}
.req{background:var(--bg);border-radius:18px;padding:14px;margin:10px 0}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;background:rgba(249,115,22,.15);color:var(--pr2)}
.tag.ok{background:rgba(22,163,74,.15);color:var(--ok)}.tag.bad{background:rgba(225,29,72,.13);color:var(--bad)}
.page{position:fixed;inset:0;z-index:1500;background:var(--bg);overflow:auto;display:none}.page.open{display:block}
.pin{max-width:640px;margin:auto;padding:0 16px 40px}
.ph{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:2;max-width:640px;margin:auto}.ph h2{font-size:24px}
.back{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.hrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px;margin:8px 0}
.hrow .ic{width:52px;height:52px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.hrow .tx{flex:1;min-width:0}.hrow .tx small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hrow .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.hrow .pc{text-align:right;font-weight:800;font-size:17px}.hrow .pc small{display:block;color:var(--mu);font-weight:500}
.day{font-weight:800;margin:18px 2px 4px;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.tile i{font-style:normal;font-size:30px}
.sos{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bad);color:#fff;border-radius:16px;padding:16px;font-weight:800;font-size:18px;text-decoration:none;margin:10px 0}
.lst{background:var(--card);border:1px solid var(--ln);border-radius:20px;margin:10px 0;overflow:hidden}.li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--ln)}.li:first-child{border-top:0}.li .tx{flex:1}.li .tx small{display:block;color:var(--mu)}
details.fq{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:8px 0}details.fq summary{font-weight:700;cursor:pointer}details.fq p{margin-top:8px;color:var(--mu)}
#drawer{position:fixed;top:0;bottom:0;left:0;width:310px;max-width:86vw;background:var(--card);z-index:2100;transform:translateX(-104%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--sh);padding:calc(20px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));overflow:auto}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2050;opacity:0;pointer-events:none;transition:opacity .25s}#scrim.open{opacity:1;pointer-events:auto}
.dp{display:flex;gap:12px;align-items:center;padding:0 20px 16px;border-bottom:1px solid var(--ln)}.dp b{font-size:18px}
.dn{flex:1;padding:8px 0}.di{display:flex;gap:16px;align-items:center;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer;border:0;background:none;color:var(--tx);width:100%;text-align:left;font-family:inherit}.di i{font-style:normal;width:26px;text-align:center;font-size:20px}.di.on{background:rgba(249,115,22,.12);color:var(--pr2)}
.dbot{padding:0 16px}
#splash{position:fixed;inset:0;z-index:3000;background:linear-gradient(160deg,#16275c,#0a1330);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}#splash .sp{font-size:72px;animation:bob 1.1s ease-in-out infinite}#splash h1{font-size:38px;letter-spacing:-1px}#splash h1 b{color:var(--pr)}#splash p{color:#aab6dd;letter-spacing:1px;font-size:12px}
@keyframes bob{50%{transform:translateX(10px) rotate(2deg)}}
.auth{max-width:440px;margin:auto;padding:calc(40px + env(safe-area-inset-top)) 20px 40px}
.auth .logo{text-align:center;margin-bottom:22px}.auth .logo h1{font-size:40px;letter-spacing:-1.5px}.auth .logo h1 b{color:var(--pr)}.auth .logo p{color:var(--mu);font-size:12px;letter-spacing:1px;margin-top:4px}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.rl button{border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:16px;padding:14px 8px;font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.rl button i{font-style:normal;font-size:28px}.rl button.on{border-color:var(--pr);background:rgba(249,115,22,.1)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--ln)}
details.sv{background:var(--bg);border-radius:14px;padding:10px 12px;margin:10px 0}details.sv summary{cursor:pointer;font-weight:600}
.leaflet-container{font:inherit;background:var(--bg)}
/* ---------- Haulie ---------- */
.haulie{position:fixed;z-index:1250;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 58px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
@media(min-width:900px){.haulie{left:444px;top:76px}}
.hface{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:3px solid #fff;background:linear-gradient(160deg,#16275c,#0a1330);box-shadow:var(--sh);padding:0;cursor:pointer;flex:0 0 auto;overflow:hidden}
.hface svg{width:100%;height:100%;display:block}
.hface .lid{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:blink 4.2s infinite}
.hface .lid.l2{animation-delay:.04s}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.hface .mo{transform-box:fill-box;transform-origin:center;transform:scaleY(.05)}
.hface.talk .mo{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.18) scaleX(.75)}to{transform:scaleY(1) scaleX(1)}}
.hface .pp{transition:transform .3s}
.hface.think .pp{transform:translate(2px,-3.5px)}
.hface .brow{transition:transform .3s}.hface.think .brow{transform:translateY(-2px)}
.hface.talk svg{animation:hbob .45s ease-in-out infinite alternate}
@keyframes hbob{to{transform:translateY(-1.5px) rotate(-1deg)}}
.hbub{pointer-events:auto;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:6px 18px 18px 18px;padding:10px 12px;box-shadow:var(--sh);max-width:min(270px,calc(100vw - 170px));font-weight:600;font-size:14px;line-height:1.4;opacity:0;visibility:hidden;transform:translateY(-4px) scale(.97);transition:opacity .2s,transform .2s,visibility .2s}
.hbub.on{opacity:1;visibility:visible;transform:none}
.hbub .hm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hbub .hm .btn{padding:6px 10px;font-size:12.5px;border-radius:10px}
.fab.mic{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 58px);right:12px;z-index:1300;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.vo{position:fixed;z-index:1400;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;box-shadow:var(--sh);padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:900px){.vo{left:20px;right:auto;bottom:20px;width:410px;border-radius:24px}}
.micbig{width:84px;height:84px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-size:34px;cursor:pointer;box-shadow:0 8px 24px rgba(249,115,22,.45)}
.micbig.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,115,22,.55)}100%{box-shadow:0 0 0 26px rgba(249,115,22,0)}}
.vtx{min-height:24px;margin:10px 0 2px;font-weight:700}
@media(prefers-reduced-motion:reduce){.hface .lid,.hface.talk svg,.micbig.on{animation:none}}
/* ---------- login page scene ---------- */
.page.authbg{background:#0a1330}
.authscene{position:fixed;inset:0;z-index:-1;background:#0a1330}
.authscene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.authscene.photo{background:linear-gradient(rgba(10,19,48,.55),rgba(10,19,48,.85)),url(/img/login-bg.jpg) center/cover no-repeat}
.authscene.photo svg{display:none}
.authbg .auth .logo h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.authbg .auth .logo p{color:#e2e8ff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.acard{background:var(--card);border-radius:22px;padding:14px 16px 16px;box-shadow:var(--sh)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ft{background:rgba(10,19,48,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 8px 12px;color:#fff;text-align:center}
.ft svg{width:76px;height:46px;display:block;margin:0 auto 4px}
.ft b{display:block;font-size:14px}.ft small{display:block;color:#cdd6f6;font-size:12px;line-height:1.3;margin-top:2px}
/* ---------- chat, calls, cancel ---------- */
.chatp{position:fixed;inset:0;z-index:1600;background:var(--bg);flex-direction:column}
.chd{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px;width:100%;max-width:640px;margin:0 auto;border-bottom:1px solid var(--ln)}
.chd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.chm{flex:1;overflow:auto;width:100%;max-width:640px;margin:0 auto;padding:10px 14px}
.chi{display:flex;gap:8px;align-items:center;width:100%;max-width:640px;margin:0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.chi .in{margin:0}
.msg{max-width:80%;width:fit-content;padding:9px 12px;border-radius:16px;margin:5px 0;overflow-wrap:anywhere;line-height:1.35}
.msg.me{margin-left:auto;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-bottom-right-radius:5px}
.msg.th{background:var(--card);border:1px solid var(--ln);border-bottom-left-radius:5px}
.msg time{display:block;font-size:10.5px;opacity:.7;margin-top:2px;text-align:right}
.msg.call .btn{background:var(--card);color:var(--tx)}
.modp{position:fixed;inset:0;z-index:2700;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.mbox{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sh)}
@media(min-width:700px){.modp{align-items:center}.mbox{border-radius:24px}}
.rsn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.rsn .btn.on{border-color:var(--pr);background:rgba(249,115,22,.12);color:var(--pr2)}
.cbadge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:800}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:2900;max-width:480px;margin:auto;background:var(--nv);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh);display:none;font-weight:600;font-size:14px}
#toast .btn{margin-top:8px;padding:8px 12px}
.sheet,.page{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.sheet{transition:max-height .22s ease}
.req .fee{margin-top:2px}
</style></head><body>
<div id="map"></div>
<div class="topbar"><button class="fab" data-a="menu" aria-label="Menu">☰</button><div class="pill">🚚 Haul<b>Go</b></div></div>
<button class="fab loc" data-a="locate" aria-label="My location">➤</button>
<section id="sheet" class="sheet"></section>

    h+=`<div class="srch"><span>🔎</span><input id="q" autocomplete="off" placeholder="${pick?"Where to & for how much?":"Pickup: type a place or tap the map"}"></div><div id="sug"></div>`}
  return h+`<div class="cred">Map © OpenStreetMap contributors</div>`}
function tripCard(){const e=est;
  return `<div class="trip"><div class="rt"><i class="dot b"></i><u></u><i class="dot o"></i></div><div class="stops"><div class="st" data-a="editpick"><small>Pickup</small><b>${esc(pick.name)}</b></div><div class="st" data-a="editdrop"><small>Drop-off</small><b>${esc(drop.name)}</b></div></div></div>`+
  (e?`<div class="meta">${fmtDist(e.km)} · about ${mins(e.km,svc)} min · ${svn(svc).i} ${svn(svc).n}</div>
  ${svc!="taxi"?`<input class="in" id="dt" placeholder="Describe the job, e.g. 2 tonnes of bricks, 3 helpers" value="${esc(details)}">`:""}
  <div class="price"><button data-a="pm" data-v="-0.5" aria-label="Lower">−</button><div><small>Your offer</small><b>${money(offer)}</b><small>Suggested ${money(e.price)}</small></div><button data-a="pm" data-v="0.5" aria-label="Raise">+</button></div>
  <div class="seg"><button data-a="pay" data-v="cash" class="${pay=="cash"?"on":""}">💵 Cash</button><button data-a="pay" data-v="ecocash" class="${pay=="ecocash"?"on":""}">📱 EcoCash</button></div>
  <button class="btn pr big" data-a="go">Find a ${svn(svc).s.toLowerCase()} driver</button>`:`<p class="mu meta">Calculating route…</p>`)+
  `<button class="btn big" data-a="rs">Cancel</button>`}
function routeBox(r){return `<div class="trip"><div class="rt"><i class="dot b"></i><u></u><i class="dot o"></i></div><div class="stops"><div class="st" style="cursor:default"><small>Pickup</small><b>${esc(r.pickup_name)}</b></div><div class="st" style="cursor:default"><small>Drop-off</small><b>${esc(r.drop_name)}</b></div></div></div>`}
function rideSheet(){const r=ride,sv=svn(r.service),d=r.d||{};
  const info=`<div class="meta" style="margin-bottom:8px"><b class="big2">${money(r.price)}</b> · ${r.payment=="ecocash"?"📱 EcoCash":"💵 Cash"} · ${sv.i} ${sv.n}${r.details?` · ${esc(r.details)}`:""}</div>`;
  if(r.status=="requested")return `<div class="radar"><i></i><i></i><i></i><span>${sv.i}</span></div><div class="center"><h2>Looking for a driver…</h2><p class="mu" style="margin-top:4px">Nearby drivers can see your offer and accept it.</p></div><div style="margin-top:14px">${routeBox(r)}${info}</div><button class="btn bad big" data-a="cx">Cancel request</button>`;
  const step=["requested","accepted","progress","done"].indexOf(r.status);
  const tl=`<div class="tl">${[1,2,3].map(i=>`<div class="${step>=i?"d":""}"></div>`).join("")}</div><div class="tlt"><span>Accepted</span><span>On the way</span><span>Trip</span></div>`;
  if(r.status=="done")return `<div class="center"><h2>Trip completed 🎉</h2><p class="big2" style="margin-top:6px">${money(r.price)}</p></div>${routeBox(r)}`+
    (r.payment=="ecocash"&&!r.paid?`<div class="c"><h3>Pay with EcoCash</h3><input class="in" id="ep" type="tel" placeholder="EcoCash number" value="${esc(prof.phone)}"><button class="btn pr big" data-a="payn">Pay ${money(r.price)}</button><p class="mu" id="pm" style="margin-top:8px"></p></div>`:"")+
    (r.rating?`<p class="center" style="margin:16px 0">You rated ${r.rating} ★</p>`:`<p class="center mu" style="margin-top:16px">How was your driver?</p><div class="stars">${[1,2,3,4,5].map(n=>`<button data-a="rt" data-v="${n}">☆</button>`).join("")}</div>`)+`<button class="btn big" data-a="rcpt">🧾 Share receipt on WhatsApp</button><button class="btn pr big" data-a="nw">Book another ride</button>`;
  return `<h2>${r.status=="accepted"?"Your driver is on the way":"Trip in progress"}</h2><p class="mu" id="eta" style="margin-top:2px">${r.status=="accepted"?"Driver accepted your offer":"Enjoy the trip"}</p>${tl}
  <div class="drv"><div class="av">${esc((d.name||"?").trim().charAt(0).toUpperCase())}</div><div style="flex:1"><b style="font-size:17px">${esc(d.name)}</b><div class="mu">${esc(d.car)} <span class="plate">${esc(d.plate)}</span></div></div></div>
  <div class="row"><a class="btn" href="tel:${esc(d.phone)}">📱 Phone call</a><a class="btn" target="_blank" rel="noopener" href="${waLink(d.phone)}">💬 WhatsApp</a><button class="btn" data-a="share">🔗 Share</button></div>${actRows(r.status=="accepted")}
  <button class="sos" data-a="sos" style="width:100%;border:0;cursor:pointer">🚨 SOS: alert my emergency contact</button>${LS.g("ec",[]).length?"":`<p class="mu center" style="margin-top:6px">Add an emergency contact in Safety so SOS can message them.</p>`}
  <div style="margin-top:14px">${routeBox(r)}</div>${info}`}

// ---------- driver ----------
function svBox(){const my=prof.services||["taxi"];return `<details class="sv"><summary>My services: ${my.map(x=>svn(x).i).join(" ")}</summary>${Object.entries(SV).map(([k,v])=>`<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" data-sv="${k}" style="width:20px;height:20px" ${my.includes(k)?"checked":""}> ${v.i} ${v.n}</label>`).join("")}<button class="btn sm" data-a="svs" style="margin-top:6px">Save services</button></details>`}
function dView(){
  if(!prof.approved)return prof.plate?`<div class="center"><div style="font-size:54px">🕒</div><h2>Documents received</h2><p class="mu" style="margin:8px 0 14px">We are checking your ID, licence and vehicle. You can start driving once you are approved.</p><button class="btn" onclick="location.reload()">Check again</button></div>`
  :`<h2>Verify your account</h2><p class="mu" style="margin:4px 0 8px">Required before you can drive. Your documents are private and only checked by HaulGo.</p>
  <input class="in" id="vid" placeholder="National ID number"><input class="in" id="vpl" placeholder="Vehicle number plate e.g. AEF 1234"><input class="in" id="vcar" placeholder="Vehicle make, model and colour">
  <p class="hd">Services you offer</p>${Object.entries(SV).map(([k,v])=>`<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" data-vs="${k}" style="width:20px;height:20px" ${k=="taxi"?"checked":""}> ${v.i} ${v.n}</label>`).join("")}
  <p class="hd">Photos</p><p class="mu">National ID photo</p><input class="in" id="f1" type="file" accept="image/*"><p class="mu">Driving licence photo</p><input class="in" id="f2" type="file" accept="image/*"><p class="mu">Selfie holding your ID</p><input class="in" id="f3" type="file" accept="image/*"><p class="mu">Photo of your vehicle showing the plate</p><input class="in" id="f4" type="file" accept="image/*">
  <button class="btn pr big" data-a="vsub" id="vsub">Submit for approval</button><p class="mu center" id="vmsg" style="margin-top:10px"></p>`;
  if(!subOk())return subView();
  const done=hist.filter(x=>x.status=="done"),now=Date.now(),sum=a=>a.reduce((s,x)=>s+ +x.price-(+x.commission||0),0);
  const today=done.filter(x=>new Date(x.created_at).toDateString()==new Date().toDateString()),week=done.filter(x=>now-new Date(x.created_at)<7*864e5);
  let h=`<div class="row between"><div><h2>${watch!=null?"You're online":"You're offline"}</h2><div class="mu">${myRate?"★ "+myRate+" rating":"No ratings yet"}</div></div><label class="sw fx"><input type="checkbox" id="on" ${watch!=null?"checked":""}><span></span></label></div>
  <div class="row" style="margin:14px 0"><div class="stat"><small>Today</small><b>${money(sum(today))}</b></div><div class="stat"><small>Last 7 days</small><b>${money(sum(week))}</b></div></div>`;
  if(ride){const sv=svn(ride.service),p=ride.p||{},to=ride.status=="accepted"?[ride.pickup_lat,ride.pickup_lng]:[ride.drop_lat,ride.drop_lng];
    return h+`<div class="c"><div class="row between"><b>${sv.i} ${sv.n}</b><span class="tag ${ride.status=="progress"?"ok":""}">${ride.status=="accepted"?"Go to pickup":"Trip in progress"}</span></div>${ride.details?`<p class="mu" style="margin-top:4px">${esc(ride.details)}</p>`:""}
    <div style="margin:10px 0">${routeBox(ride)}</div><p>Fare <b>${money(ride.price)}</b> (${ride.payment}) · you keep <b>${money(ride.price-(+ride.commission||0))}</b></p>
    <p class="mu" style="margin:6px 0 10px">${esc(p.name)} · ${esc(p.phone)}</p>
    <div class="row"><a class="btn" href="tel:${esc(p.phone)}">📱 Phone call</a><a class="btn" target="_blank" rel="noopener" href="${waLink(p.phone)}">💬 WhatsApp</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${to[0]},${to[1]}">🧭 Navigate</a></div>
    ${actRows(false)}
    <button class="btn pr big" data-a="st" data-v="${ride.status=="accepted"?"progress":"done"}">${ride.status=="accepted"?"Passenger picked up":"Complete ride"}</button></div>`}
  return h+svBox()+`<h3 style="margin-top:6px">Requests (${open.length})</h3>`+(open.map((r,i)=>`<div class="req"><div class="row between"><b>${svn(r.service).i} ${svn(r.service).n}</b><b class="big2">${money(r.price)}</b></div>${r.details?`<p class="mu">${esc(r.details)}</p>`:""}
    <div style="margin:10px 0">${routeBox(r)}</div><p class="mu">${fmtDist(r.km)} · ${r.payment=="ecocash"?"📱 EcoCash":"💵 Cash"}</p><p class="mu fee">Fee ${money(feeOf(r))} · you keep <b>${money(r.price-feeOf(r))}</b></p>
    <div class="row" style="margin-top:10px"><button class="btn" data-a="vmap" data-v="${r.id}">Map</button>${accBtn(r)}</div></div>`).join("")||`<div class="center" style="padding:22px 0"><div style="font-size:42px">📭</div><p class="mu">${watch!=null?"No requests right now. Stay online.":"Go online to receive requests."}</p></div>`)}

// ---------- pages ----------
function hdr(t,back=true){return `<div class="ph">${back?`<button class="back" data-a="back" aria-label="Back">←</button>`:""}<h2>${t}</h2></div><div class="pin">`}
function subPage(p){return p=="wallet"?walletPage():p=="earnings"?earnPage():p=="history"?histPage():p=="safety"?safetyPage():p=="settings"?settingsPage():p=="help"?helpPage():p=="contacts"?contactsPage():null}
const subOk=()=>prof.role=="admin"||(+prof.wallet||0)>=MIN_WALLET;
function walletBox(){return `<div class="c"><div class="row between"><b>Top up your wallet</b><b>${money(prof.wallet)}</b></div>
<p class="mu" style="margin:6px 0 10px">HaulGo takes a 10% fee from your wallet each time you accept a ride. You keep 100% of the cash the passenger pays you.</p>
<div style="padding:12px;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px"><b>Option 1: Pay now with EcoCash</b><div class="mu" style="margin:2px 0 8px">Instant. We send a prompt to your phone, you enter your EcoCash PIN, and your wallet is topped up by itself.</div>
<input class="in" id="pnamt" type="number" min="1" step="0.5" placeholder="Amount, e.g. 5"><input class="in" id="pnph" type="tel" placeholder="Your EcoCash number" value="${esc(prof.phone||"")}">
<button class="btn pr big" data-a="pnpay">Pay with EcoCash</button><p class="mu center" id="pnmsg" style="margin-top:6px"></p></div>
<div style="padding:12px;border:1px solid var(--ln);border-radius:14px"><b>Option 2: Send EcoCash yourself</b><div class="mu" style="margin:2px 0 8px">Send money to either number below, then enter the amount and the EcoCash reference. We confirm it shortly.</div>
${WALLET_ACCOUNTS.map(a=>`<div class="row between" style="margin-bottom:6px"><div><b>${esc(a.n)}</b><div class="mu">${esc(a.name)}</div></div><button class="btn sm fx" data-a="copynum" data-v="${esc(a.n)}">Copy</button></div>`).join("")}
<input class="in" id="wamt" type="number" min="1" step="0.5" placeholder="Amount sent, e.g. 10"><input class="in" id="sref" placeholder="EcoCash reference / transaction code"><button class="btn big" data-a="subpay">I have paid</button><p class="mu center" id="smsg" style="margin-top:8px"></p></div></div>`}
function subView(){return `<div class="center"><div style="font-size:54px">👛</div><h2>Top up to get ride requests</h2><p class="mu" style="margin:8px 0 14px">Your wallet has ${money(prof.wallet)}. You need at least ${money(MIN_WALLET)} to receive requests.</p></div>`+walletBox()+(SUPPORT_PHONE?`<a class="btn big" target="_blank" rel="noopener" href="${waLink(SUPPORT_PHONE)}">💬 Contact support</a>`:"")}
function walletPage(){return hdr("Wallet")+`<div class="center" style="margin:10px 0"><p class="mu">Balance</p><p class="big2">${money(prof.wallet)}</p></div>`+walletBox()+`<h3 style="margin:16px 2px 6px">Recent activity</h3>`+(txns.length?txns.map(x=>`<div class="hrow"><div class="ic">${+x.amount<0?"➖":"➕"}</div><div class="tx"><b>${esc(x.note||x.kind)}</b><small>${dayOf(x.created_at)} ${timeOf(x.created_at)}</small></div><b>${(+x.amount<0?"-":"+")+money(Math.abs(x.amount))}</b></div>`).join(""):`<p class="mu center" style="padding:20px">No activity yet.</p>`)}
function subPending(){return subs.length?`<h3 style="margin:6px 2px">Top-ups to confirm</h3>`+subs.map(x=>`<div class="c"><div class="row between"><b>${esc((x.p||{}).name)}</b><b>${money(x.amount)}</b></div><p class="mu">${esc((x.p||{}).phone)} · Ref: <b>${esc(x.reference)}</b> · ${dayOf(x.created_at)}</p><button class="btn pr" data-a="subok" data-v="${x.id}">Confirm and add ${money(x.amount)}</button></div>`).join(""):""}
function earnPage(){const done=hist.filter(x=>x.status=="done"),n=x=>+x.price-(+x.commission||0),sum=a=>a.reduce((t,x)=>t+n(x),0),now=Date.now(),inD=d=>done.filter(x=>now-new Date(x.created_at)<d*864e5);
  return hdr("Earnings")+`<div class="row"><div class="stat"><small>Today</small><b>${money(sum(inD(1)))}</b></div><div class="stat"><small>7 days</small><b>${money(sum(inD(7)))}</b></div></div><div class="row" style="margin-top:8px"><div class="stat"><small>30 days</small><b>${money(sum(inD(30)))}</b></div><div class="stat"><small>Rating</small><b>${myRate?"★ "+myRate:"-"}</b></div></div><p class="mu" style="margin:10px 2px">${done.length} trips completed. Shown after the 10% fee taken from your wallet. Wallet balance: ${money(prof.wallet)}.</p>`+done.slice(0,30).map(x=>`<div class="hrow"><div class="ic">${svn(x.service).i}</div><div class="tx"><b>${esc(x.pickup_name)} to ${esc(x.drop_name)}</b><small>${dayOf(x.created_at)} ${timeOf(x.created_at)}${x.rating?" · "+x.rating+" ★":""}</small></div><b>${money(n(x))}</b></div>`).join("")}
function histPage(){const r=role(),isP=r=="passenger";
  let list=hist.filter(x=>filt=="all"||(filt=="city"?(x.service||"taxi")=="taxi":(x.service||"taxi")!="taxi"));
  let h=hdr("Order history")+`<div class="chips" style="padding-bottom:6px">${[["all","All"],["city","Rides"],["haul","Trucks & hire"]].map(([k,v])=>`<button class="chip ${filt==k?"on":""}" style="min-width:0;padding:9px 16px;flex-direction:row" data-a="filt" data-v="${k}">${v}</button>`).join("")}</div>`;
  if(!list.length)return h+`<div class="center" style="padding:50px 0"><div style="font-size:48px">🧾</div><p class="mu">Nothing here yet.</p></div></div>`;
  let last="";list.forEach(x=>{const dl=dayOf(x.created_at);if(dl!=last){h+=`<div class="day">${dl}</div>`;last=dl}
    h+=`<div class="hrow" ${isP?`data-a="rebook" data-v="${hist.indexOf(x)}" style="cursor:pointer"`:""}><div class="ic">${svn(x.service).i}</div><div class="tx"><small>${esc(x.pickup_name)}</small><b>${esc(x.drop_name)}</b><small>${timeOf(x.created_at)}${x.status!="done"?` · ${x.status}`:""}</small></div><div class="pc">${money(isP?x.price:x.price-(+x.commission||0))}<small>${x.status=="cancelled"?"Cancelled":isP?"Tap to book again":"you kept"}</small></div></div>`});

function safetyPage(){const ec=LS.g("ec",[]);
  return hdr("Safety")+`<div class="tiles"><a class="tile" ${SUPPORT_PHONE?`target="_blank" rel="noopener" href="${waLink(SUPPORT_PHONE)}"`:`data-a="nav" data-v="help"`} style="color:inherit;text-decoration:none"><i>💬</i><b>Support</b></a><a class="tile" href="#ec" data-a="ecgo" style="color:inherit;text-decoration:none"><i>👥</i><b>Emergency contacts</b></a></div>
  <a class="sos" href="tel:${EMERGENCY}">🚨 Call ${EMERGENCY}</a>
  <h3 style="margin:18px 2px 6px">How you're protected</h3>
  <div class="tiles"><div class="tile"><b>Verified drivers</b><span class="mu">ID, licence, vehicle and selfie are checked by AI, then approved by a person.</span></div><div class="tile"><b>Know your driver</b><span class="mu">See your driver's name, vehicle and number plate before pickup.</span></div><div class="tile"><b>Share your trip</b><span class="mu">Send trip details to family or friends in one tap.</span></div><div class="tile"><b>Rate every trip</b><span class="mu">Ratings keep drivers accountable.</span></div></div>
  <h3 id="ec" style="margin:18px 2px 6px">Emergency contacts</h3><p class="mu" style="margin:0 2px 8px">Saved on this device only. Used when you tap Share on a trip.</p>
  ${ec.map((c,i)=>`<div class="hrow"><div class="ic">👤</div><div class="tx"><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></div><button class="btn sm bad" data-a="ecdel" data-v="${i}">Remove</button></div>`).join("")}
  ${ec.length<3?`<div class="c"><input class="in" id="ecn" placeholder="Name"><input class="in" id="ecp" type="tel" placeholder="Phone e.g. 0771234567"><button class="btn big" data-a="ecadd">Add contact</button></div>`:""}</div>`}
function segs(key,val,opts){return `<div class="seg">${opts.map(([k,v])=>`<button data-a="${key}" data-v="${k}" class="${val==k?"on":""}">${v}</button>`).join("")}</div>`}
function settingsPage(){return hdr("Settings")+`<div class="c"><b>Appearance</b>${segs("theme",set.theme,[["system","System"],["light","Light"],["dark","Dark"]])}</div>
  <div class="c"><b>Distance units</b>${segs("units",set.units,[["km","Kilometres"],["mi","Miles"]])}</div>${haulieSettings()}
  <div class="lst"><div class="li"><div class="tx"><b>Language</b><small>English</small></div></div><div class="li"><div class="tx"><b>Account</b><small>${esc(me.email)}</small></div></div><div class="li"><div class="tx"><b>App version</b><small>${APP_VERSION}</small></div></div>
  <div class="li" data-a="nav" data-v="help" style="cursor:pointer"><div class="tx"><b>Delete account</b><small>Contact support to remove your account and data</small></div></div></div>
  <p class="cred">Map data © OpenStreetMap contributors</p></div>`}
function helpPage(){const f=[["How is the price set?","You choose your offer. We show a suggested price based on distance and the service. Drivers can accept your offer if it works for them."],["How do I pay?","Pay your driver in cash, or choose EcoCash and pay after the trip."],["What can I book?","Taxi rides, pickup trucks, heavy trucks and haulage, and equipment with crew."],["How do I become a driver?","Sign up and choose Drive & earn. Upload your ID, licence, selfie and vehicle photo. After checks, you will be approved."],["What does HaulGo charge?","Drivers keep all the cash the passenger pays. HaulGo takes a 10% fee from the driver's prepaid wallet when a ride is accepted."],["Something went wrong on a trip","Use the Safety page for emergencies. For other problems, contact support."]];
  return hdr("Help")+f.map(([q,a])=>`<details class="fq"><summary>${q}</summary><p>${a}</p></details>`).join("")+(SUPPORT_PHONE?`<a class="btn pr big" target="_blank" rel="noopener" href="${waLink(SUPPORT_PHONE,"Hello HaulGo support")}">💬 Chat with support</a>`:"")+`</div>`}
function adminPage(){const d=all.filter(x=>x.status=="done"),g=d.reduce((s,x)=>s+ +x.price,0),c=d.reduce((s,x)=>s+ +x.commission,0),pend=drivers.filter(x=>!x.approved).length;
  let b="";
  if(atab=="over")b=`<div class="row" style="margin:6px 0"><div class="stat"><small>Your fees earned</small><b>${money(c)}</b></div><div class="stat"><small>Gross rides</small><b>${money(g)}</b></div></div><div class="row"><div class="stat"><small>Completed rides</small><b>${d.length}</b></div><div class="stat"><small>Drivers pending</small><b>${pend}</b></div></div><h3 style="margin:16px 2px 6px">Registered people</h3><div class="row"><div class="stat"><small>Total registered</small><b>${ppl.length}</b></div><div class="stat"><small>New in 7 days</small><b>${ppl.filter(x=>Date.now()-new Date(x.created_at)<7*864e5).length}</b></div></div><div class="row" style="margin-top:8px"><div class="stat"><small>Passengers</small><b>${ppl.filter(x=>x.role=="passenger").length}</b></div><div class="stat"><small>Drivers</small><b>${ppl.filter(x=>x.role=="driver").length}</b></div></div><h3 style="margin:16px 2px 6px">Download reports (CSV)</h3><div class="row"><button class="btn" data-a="csv" data-v="users">👥 Users</button><button class="btn" data-a="csv" data-v="rides">🚕 Rides</button><button class="btn" data-a="csv" data-v="weekly">📈 Weekly</button></div>`;

// Free calls open a Jitsi room. To use your own Jitsi server later, change CALL_BASE (keep the trailing slash).
const CALL_BASE="https://meet.jit.si/";
// For calls with NO sign-in step, set up Daily (see the setup notes) and put your Daily name here, e.g. "haulgo" for haulgo.daily.co.
// Leave "" to keep using free Jitsi (its first caller may be asked to sign in once).
const DAILY_DOMAIN="haulgo";
const CH={open:false,rideId:null,msgs:[],loaded:false,unread:0};
let inviteLink="",cxReason="",prevDrv=null;
const REASONS=["Driver is taking too long","Changed my mind","Wrong pickup or drop-off","Found another ride","Driver asked me to cancel","Other"];
// only links to our own call rooms are ever treated as call links
const okCall=u=>typeof u=="string"&&/^[\w:\/.\-#=&%?]+$/.test(u)&&(u.startsWith(CALL_BASE+"haulgo-")||(!!DAILY_DOMAIN&&u.startsWith(`https://${DAILY_DOMAIN}.daily.co/haulgo-`)));
const hex=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,"0")).join("")};
const peer=()=>{const r=ride||{};return role()=="driver"?(r.p||{}):(r.d||{})};
const peerWord=()=>role()=="driver"?"passenger":"driver";
function toast(h,ms){const t=$("toast");if(!t)return;t.innerHTML=h;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>{t.style.display="none"},ms||6000)}
function modal(h){const m=$("modal");m.innerHTML=`<div class="mbox">${h}</div>`;m.style.display="flex"}
function modalClose(){const m=$("modal");m.style.display="none";m.innerHTML=""}
const cbText=()=>CH.unread?`<span class="cbadge">${CH.unread}</span>`:"";
const chatBtn=()=>`<button class="btn" data-a="chat">💬 Chat <span class="cb">${cbText()}</span></button>`;
const chBadge=()=>document.querySelectorAll(".cb").forEach(e=>{e.innerHTML=cbText()});

// ---------- chat ----------
function chSync(){const id=ride?ride.id:null;if(CH.rideId!==id){CH.rideId=id;CH.msgs=[];CH.loaded=false;CH.unread=0}}
function chWatch(){chSync();pushHook();if(CH.open&&(!ride||!isActive(ride)))chatClose();
  if(role()=="driver"){if(ride)prevDrv=ride.id;else if(prevDrv){const x=hist.find(h=>h.id==prevDrv);if(x&&x.status=="cancelled")toast("❌ The passenger cancelled this trip."+(+x.commission>0?" Your fee was returned to your wallet.":""),9000);prevDrv=null}}}
async function loadMsgs(){chSync();if(!ride||CH.loaded)return;const id=ride.id;
  const{data}=await sb.from("messages").select("*").eq("ride_id",id).order("created_at");if(CH.rideId!==id)return;
  const have=CH.msgs;CH.msgs=data||[];have.forEach(addMsg);CH.msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));CH.loaded=true}
function addMsg(m){if(CH.msgs.some(x=>x.id==m.id))return false;CH.msgs.push(m);return true}
const mh=m=>{const mine=m.sender_id==me.id;
  if(m.kind=="call"){const ok=okCall(m.body),vid=/startWithVideoMuted=false/.test(m.body);
    return `<div class="msg call ${mine?"me":"th"}"><b>${vid?"📹 Video call":"📞 Voice call"}</b><div>${mine?"You started a call":"Incoming call"}</div>${ok?`<button class="btn sm" data-a="joincall" data-v="${m.body}" style="margin-top:6px">Join call</button>`:""}<time>${timeOf(m.created_at)}</time></div>`}
  return `<div class="msg ${mine?"me":"th"}">${esc(m.body)}<time>${timeOf(m.created_at)}</time></div>`};
function chRender(){const c=$("chm");if(!c||!CH.open)return;
  c.innerHTML=CH.msgs.length?CH.msgs.map(mh).join(""):`<p class="mu center" style="padding:30px">Say hello 👋 Chat and free calls stay between you and your ${peerWord()}.</p>`;c.scrollTop=c.scrollHeight}
async function chOpen(){if(!ride||!isActive(ride))return toast("Chat is available once a driver accepts the trip.");
  chSync();DM.open=false;CH.open=true;CH.unread=0;chBadge();const pe=peer(),p=$("chat");p.style.display="flex";
  p.innerHTML=`<div class="chd"><button class="back" data-a="chatclose" aria-label="Back">←</button><div style="flex:1;min-width:0"><b>${esc(pe.name||"Chat")}</b><small class="mu">${role()=="driver"?"Passenger":"Driver"}</small></div><button class="btn sm" data-a="vcall" data-v="0" aria-label="Free voice call">📞</button><button class="btn sm" data-a="vcall" data-v="1" aria-label="Free video call">📹</button><button class="btn sm" data-a="invite" aria-label="Invite someone">👥</button></div><div class="chm" id="chm"></div><div class="chi"><input class="in" id="cmt" placeholder="Type a message" autocomplete="off" maxlength="1000"><button class="btn pr fx" data-a="chsend">Send</button></div>`;
  $("cmt").onkeydown=e=>{if(e.key=="Enter")chSend()};
  await loadMsgs();chRender()}
function chatClose(){CH.open=false;const p=$("chat");if(p){p.style.display="none";p.innerHTML=""}}
async function postMsg(kind,body){chSync();if(!ride||!isActive(ride)){toast("This trip is no longer active.");return null}
  const{data,error}=await sb.from("messages").insert({ride_id:ride.id,kind,body}).select().single();
  if(error){toast("Message not sent: "+esc(error.message));return null}
  if(addMsg(data)&&CH.open)chRender();pushNote("ride",null,ride.id,prof.name||"HaulGo",kind=="call"?"📞 Calling you. Tap to join":body.slice(0,120),"chat-"+ride.id);return data}
async function chSend(){const i=$("cmt"),v=i?i.value.trim():"";if(!v||!ride)return;i.value="";i.focus();await postMsg("text",v)}
function onMsg(m){if(!ride||!me||m.ride_id!=ride.id)return;chSync();if(!addMsg(m))return;const mine=m.sender_id==me.id;
  if(CH.open){chRender();return}
  if(mine)return;CH.unread++;chBadge();
  if(m.kind=="call"&&okCall(m.body)){toast(`📞 ${esc(peer().name||"Your "+peerWord())} is calling you<br><button class="btn pr" data-a="joincall" data-v="${m.body}">Join call</button>`,20000);if(navigator.vibrate)navigator.vibrate([300,120,300,120,300])}
  else toast(`💬 ${esc(peer().name||"New message")}: ${esc(m.body.slice(0,80))}<br><button class="btn" data-a="chat">Open chat</button>`,6000)}

// ---------- free calls (voice, video, invite someone) ----------
function joinUrl(u){if(u.includes(".daily.co/"))return u;const n=((prof&&prof.name)||"HaulGo user").replace(/["\\]/g,"");return u+(u.includes("#")?"&":"#")+"userInfo.displayName="+encodeURIComponent('"'+n+'"')}
function openCall(u){if(!okCall(u))return;const w=window.open(joinUrl(u),"_blank");if(w){try{w.opener=null}catch(e){}}else location.href=joinUrl(u)}
// makes a call room: Daily (timed, no sign-in) when set up, otherwise a free Jitsi room
async function newRoom(video,minutes){
  if(DAILY_DOMAIN){try{const{data:{session}}=await sb.auth.getSession();
    const r=await fetch("/api/call",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(session?session.access_token:"")},body:JSON.stringify({video:!!video,minutes})});
    const j=await r.json();if(j.url&&okCall(j.url))return j.url}catch(e){}}
  return CALL_BASE+`haulgo-${hex()}`+"#config.startWithVideoMuted="+(video?"false":"true")}
const withMode=(u,video)=>{const b=u.split("#")[0];return b.includes(".daily.co/")?b:b+"#config.startWithVideoMuted="+(video?"false":"true")};
// one room per trip (reused for 50 minutes) so the driver, passenger and any invited person land in the same call
async function ensureRoom(video){await loadMsgs();const c=[...CH.msgs].reverse().find(m=>m.kind=="call"&&okCall(m.body)&&Date.now()-new Date(m.created_at)<50*6e4);
  return c?withMode(c.body,video):await newRoom(video,60)}
async function startCall(video){chSync();if(!ride||!isActive(ride))return toast("Calls work once a driver accepts the trip.");
  const w=window.open("","_blank");if(w){try{w.opener=null}catch(e){}}   // opened now so phones do not block it
  const u=await ensureRoom(video),m=await postMsg("call",u);
  if(!m){if(w)w.close();return}
  if(w)w.location.href=joinUrl(u);else toast(`Your call is ready<br><button class="btn pr" data-a="joincall" data-v="${u}">Join call</button>`,15000);
  if(!DAILY_DOMAIN&&!LS.g("jhint",false)){LS.s("jhint",true);setTimeout(()=>toast("Tip: if the call page asks you to sign in, sign in with Google once. The other person joins with no sign-in.",10000),1500)}}
async function inviteOpen(){chSync();if(!ride||!isActive(ride))return toast("Invites work once a driver accepts the trip.");
  inviteLink=await ensureRoom(false);const base=inviteLink.split("#")[0];
  if(!CH.msgs.some(m=>m.kind=="call"&&okCall(m.body)&&m.body.split("#")[0]==base))await postMsg("call",inviteLink);   // lets the other trip member join too
  const ec=LS.g("ec",[]);
  modal(`<div class="row between"><h2>👥 Invite someone to the call</h2><button class="btn sm fx" data-a="modalclose">✕</button></div>
  <p class="mu" style="margin:6px 0 10px">Someone at the destination can help with directions. They open the link in any browser, no account needed, and you, your ${peerWord()} and them can all talk together.</p>
  ${ec.map((c,i)=>`<button class="btn big" data-a="invwa" data-v="${i}" style="margin-top:6px">💬 Send to ${esc(c.name)}</button>`).join("")}
  <input class="in" id="invp" type="tel" placeholder="Phone number e.g. 0771234567"><button class="btn pr big" data-a="invwa" data-v="-1">Send link on WhatsApp</button>
  <div class="row" style="margin-top:8px"><button class="btn" data-a="invcopy">📋 Copy link</button><button class="btn" data-a="joincall" data-v="${inviteLink}">Join now</button></div>`)}

// ---------- cancel trip (passenger) ----------
function cancelOpen(){if(!ride||!["requested","accepted"].includes(ride.status))return;cxReason="";
  modal(`<h2>Cancel this trip?</h2><p class="mu" style="margin:4px 0 12px">${ride.status=="accepted"?"Your driver has already accepted and may be on the way. ":""}Tell us why (optional):</p>

async function cancelGo(){const o=$("cxo"),extra=o?o.value.trim():"",reason=[cxReason,extra].filter(Boolean).join(": ")||null,id=ride.id;

Object.assign(A,{

const FR={list:[],blocked:[],unread:{},msg:"",miss:""};
const DM={open:false,peer:null,msgs:[]};
let lastDmLink="";
const QUICK_MIN=5;   // quick friend calls end by themselves after this many minutes (only enforced when Daily is set up)
// must match norm_phone() in the database
const normPhone=p=>{let d=String(p||"").replace(/\D/g,"").replace(/^00/,"");if(!d)return "";if(d.startsWith("263"))return d;if(d.startsWith("0"))return "263"+d.slice(1);if(d.length==9)return "263"+d;return d};
const fname=f=>LS.g("calias",{})[f.phone]||f.name||"Friend";
const markSeen=id=>{const s=LS.g("dmseen",{});s[id]=new Date().toISOString();LS.s("dmseen",s)};
const dmAdd=m=>{if(DM.msgs.some(x=>x.id==m.id))return false;DM.msgs.push(m);return true};

function contactsPage(){const cs=!!(navigator.contacts&&navigator.contacts.select);

async function loadFriends(){if(!me)return;
  const f=await sb.from("friends").select("*").order("name");FR.list=f.data||[];
  const b=await sb.from("blocks").select("*");FR.blocked=b.data||[];
  const seen=LS.g("dmseen",{}),r=await sb.from("dm_messages").select("sender_id,created_at").eq("receiver_id",me.id).order("created_at",{ascending:false}).limit(300);
  FR.unread={};(r.data||[]).forEach(m=>{if(!seen[m.sender_id]||new Date(m.created_at)>new Date(seen[m.sender_id]))FR.unread[m.sender_id]=(FR.unread[m.sender_id]||0)+1});
  if(pg=="contacts")view()}
async function syncNums(nums){const out=[];for(let i=0;i<nums.length;i+=300){const{data,error}=await sb.rpc("sync_contacts",{p_phones:nums.slice(i,i+300)});if(error)throw error;out.push(...(data||[]))}return out}
function foundMsg(n){return n?`Found ${n} friend${n>1?"s":""} on HaulGo and added ${n>1?"them":"them"} to your contacts.`:"None of those people are on HaulGo yet. Invite them!"}
async function csync(){let picks;
  try{picks=await navigator.contacts.select(["name","tel"],{multiple:true})}catch(e){if(e&&e.name!="AbortError"){FR.msg="Could not open your contacts: "+e.message;view()}return}
  if(!picks||!picks.length)return;FR.msg="Checking…";FR.miss="";view();
  try{const al=LS.g("calias",{}),mine=normPhone(prof.phone),nums=new Set();
    picks.forEach(c=>(c.tel||[]).forEach(t=>{const n=normPhone(t);if(n&&n!=mine){nums.add(n);if(c.name&&c.name[0])al[n]=c.name[0]}}));
    LS.s("calias",al);const found=await syncNums([...nums]);FR.msg=foundMsg(found.length);await loadFriends()}
  catch(e){FR.msg="Could not check contacts: "+e.message;view()}}
async function fadd(){const n=normPhone(($("fpn")||{}).value);if(n.length<9){FR.msg="Enter a full phone number.";FR.miss="";return view()}
  FR.msg="Checking…";FR.miss="";view();
  try{const found=await syncNums([n]);FR.msg=found.length?`Added ${found[0].f_name||"your friend"}.`:"That number is not on HaulGo yet.";FR.miss=found.length?"":n;await loadFriends()}
  catch(e){FR.msg="Could not check: "+e.message;view()}}
const INVITE=()=>`Hi! I use HaulGo in Harare for rides, pickups and haulage. Install it free and we can chat and call each other on the app: ${location.origin}`;

async function dmOpen(id){const f=FR.list.find(x=>x.friend_id==id);if(!f)return;
  chatClose();DM.open=true;DM.peer=f;DM.msgs=[];delete FR.unread[id];markSeen(id);

function friendly(m){m=String(m||"");
  if(/column|expression is of type|uuid|bigint|violates|syntax error|does not exist|relation |permission denied/i.test(m))return "Something went wrong on our side. Please try again in a moment.";
  if(/jwt|token/i.test(m)&&/expired|invalid/i.test(m))return "Please sign in again.";
  if(/failed to fetch|network|load failed/i.test(m))return "No internet connection. Please try again.";
  return m}

// ---------- scrolling: never redraw the sheet while a finger is scrolling it ----------
const TCH={on:false,mv:false,t:0,timer:0};
const busy=()=>(TCH.on&&TCH.mv)||Date.now()-TCH.t<700;
function defer(){if(TCH.timer)return;TCH.timer=setTimeout(()=>{TCH.timer=0;view()},750)}
["sheet","page"].forEach(id=>{const el=$(id);
  el.addEventListener("touchstart",()=>{TCH.on=true;TCH.mv=false},{passive:true});
  el.addEventListener("touchmove",()=>{TCH.mv=true;TCH.t=Date.now()},{passive:true});
  el.addEventListener("touchend",()=>{TCH.on=false},{passive:true});
  el.addEventListener("touchcancel",()=>{TCH.on=false},{passive:true});
  el.addEventListener("scroll",()=>{TCH.t=Date.now()},{passive:true})});

// ---------- drag the sheet down to see the map, drag up to open it again (phones) ----------
(function(){const s=$("sheet");let on=false,cand=false,y0=0,h0=0,moved=false;
  const H=()=>innerHeight,DEF=()=>Math.round(H()*.68),TOP=()=>Math.round(H()*.88),PEEK=150;
  const setH=h=>{s.style.maxHeight=Math.round(h)+"px"},peeked=()=>s.getBoundingClientRect().height<=PEEK+6;
  s.addEventListener("touchstart",e=>{if(innerWidth>=900)return;const r=s.getBoundingClientRect(),t=e.touches[0];
    y0=t.clientY;h0=r.height;moved=false;on=(t.clientY-r.top)<36;cand=!on&&s.scrollTop<=0;if(on){s.style.transition="none";s.style.overflowY="hidden"}},{passive:true});
  s.addEventListener("touchmove",e=>{if(innerWidth>=900)return;const y=e.touches[0].clientY,dy=y-y0;
    if(!on&&cand){if(dy>12||(dy<-12&&peeked())){on=true;moved=true;y0=y;h0=s.getBoundingClientRect().height;s.style.transition="none";s.style.overflowY="hidden";return}if(dy<-12)cand=false}
    if(!on)return;if(Math.abs(dy)>6)moved=true;if(e.cancelable)e.preventDefault();s.scrollTop=0;setH(Math.max(PEEK,Math.min(TOP(),h0-dy)))},{passive:false});
  const end=()=>{if(!on)return;on=false;cand=false;s.style.transition="";s.style.overflowY="";
    const h=parseFloat(s.style.maxHeight)||s.getBoundingClientRect().height;let to;
    if(!moved)to=peeked()?DEF():PEEK;else to=[PEEK,DEF(),TOP()].reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a);
    setH(to);s.scrollTop=0};
  s.addEventListener("touchend",end,{passive:true});s.addEventListener("touchcancel",end,{passive:true});
  addEventListener("resize",()=>{if(innerWidth>=900)s.style.maxHeight=""});
})();
