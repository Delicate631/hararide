const D=P5.d,SPEED={taxi:28,pickup:26,truck:22,bike:30,delivery:28},ROAD=1.3;
async function dsLoad(){if(D.busy)return;D.busy=1;
 try{const since=new Date(Date.now()-90000).toISOString(),d30=new Date(Date.now()-30*864e5).toISOString(),d1=new Date(Date.now()-864e5).toISOString();
  const[pr,lo,ac,rq,hs,hz]=await Promise.all([
   sb.from("profiles").select("id,name,phone,plate,services,vehicle_categories,approved,suspended").eq("role","driver"),
   sb.from("driver_locations").select("*").gt("updated_at",since),
   sb.from("rides").select("id,driver_id,status").in("status",["accepted","progress"]),
   sb.from("rides").select("*").eq("status","requested").order("created_at"),
   sb.from("rides").select("driver_id,status,rating").not("driver_id","is",null).in("status",["done","cancelled"]).gt("created_at",d30).limit(4000),
   sb.from("rides").select("pickup_lat,pickup_lng,status").gt("created_at",d1).limit(2000)]);
  let bids={};try{const ids=(rq.data||[]).map(x=>x.id);if(ids.length){const b=await sb.from("ride_bids").select("ride_id").in("ride_id",ids);(b.data||[]).forEach(x=>bids[x.ride_id]=1)}}catch(e){}
  const perf={};(hs.data||[]).forEach(r=>{const p=perf[r.driver_id]=perf[r.driver_id]||{d:0,c:0,rs:0,rn:0};r.status=="done"?p.d++:p.c++;if(r.rating){p.rs+=r.rating;p.rn++}});
  const loc={},bsy={};(lo.data||[]).forEach(l=>loc[l.driver_id]=l);(ac.data||[]).forEach(r=>bsy[r.driver_id]=r.id);
  const drivers=(pr.data||[]).filter(p=>p.approved&&!p.suspended).map(p=>{const l=loc[p.id],pf=perf[p.id]||{d:0,c:0,rs:0,rn:0},tot=pf.d+pf.c;
   return{...p,loc:l||null,state:!l?"offline":bsy[p.id]?"busy":"available",rel:tot?pf.d/tot:.8,rating:pf.rn?pf.rs/pf.rn:4.2,trips:pf.d}});
  const cell={};(hz.data||[]).filter(r=>r.pickup_lat!=null).forEach(r=>{const k=r.pickup_lat.toFixed(2)+","+r.pickup_lng.toFixed(2),c=cell[k]=cell[k]||{lat:+r.pickup_lat.toFixed(2),lng:+r.pickup_lng.toFixed(2),n:0,open:0};c.n++;if(r.status=="requested")c.open++});
  const hot=Object.values(cell).sort((a,b)=>b.n-a.n).slice(0,6);
  const sig=drivers.map(x=>x.id+x.state+(x.loc?x.loc.lat.toFixed(3)+x.loc.lng.toFixed(3):"")).join()+"|"+(rq.data||[]).map(x=>x.id).join();
  const changed=sig!==D.sig;D.sig=sig;D.data={drivers,requests:rq.data||[],bids,hot,at:Date.now()};
  if(D.auto)await autoMatch();
  if(changed||D.force){D.force=false;view()}
 D.err=""}catch(e){console.error("dispatch load failed",e);D.err="Dispatch could not load: "+(e&&e.message||sqlMsg(e));D.busy=0;view();return}D.busy=0}
function candidates(r){const sv=r.service||"taxi";return(D.data.drivers||[]).filter(d=>d.state=="available"&&d.loc&&(d.services||["taxi"]).includes(sv)&&(!r.vehicle_category||(d.vehicle_categories||["economy"]).includes(r.vehicle_category))).map(d=>{
  const km=hav(r.pickup_lat,r.pickup_lng,d.loc.lat,d.loc.lng),road=km*ROAD,eta=Math.max(1,Math.round(road/(SPEED[sv]||28)*60)+1),
   score=.55*Math.max(0,1-km/8)+.25*Math.min(1,d.rating/5)+.20*d.rel;return{d,km,eta,score}}).sort((a,b)=>b.score-a.score)}
async function assign(r,c,mode){const{data,error}=await sb.rpc("admin_assign_driver",{p_ride:r.id,p_driver:c.d.id,p_mode:mode,p_score:+c.score.toFixed(3),p_km:+c.km.toFixed(2),p_eta:c.eta});
 if(error){toast("⚠️ "+esc(sqlMsg(error)),4500);return false}return data}
async function autoMatch(){const now=Date.now();for(const r of D.data.requests){if(D.done.has(r.id)||D.data.bids[r.id]||now-new Date(r.created_at)<25000||r.pickup_lat==null)continue;
  const c=candidates(r)[0];if(!c||c.km>8||c.score<.35)continue;D.done.add(r.id);if(await assign(r,c,"auto")){toast(`🤖 Auto-matched ${refOf(r)} to ${esc(c.d.name||"driver")} (${c.eta} min away)`,6000);D.force=true;D.sig="";await new Promise(o=>setTimeout(o,300));D.busy=0;return dsLoad()}}}

 <h3 style="margin:14px 2px 6px">Waiting requests and best matches</h3>
 ${x.requests.map(r=>{const cs=r.pickup_lat==null?[]:candidates(r).slice(0,3),age=Math.round((Date.now()-new Date(r.created_at))/60000);
  return `<div class="p5c"><div class="row between"><b>${refOf(r)} · ${esc(svn?svn(r.service).s:r.service||"taxi")}</b><span class="p5m">${age} min waiting${x.bids[r.id]?" · has bids":""}</span></div><p class="p5m">${esc(r.pickup_name)} → ${esc(r.drop_name)} · ${money(r.price)}</p>

 <h3 style="margin:14px 2px 6px">Demand hotspots</h3><div class="p5c">${x.hot.map(h=>`<div class="p5r"><div><b>${h.n} requests</b><small>${h.lat}, ${h.lng} · ${h.open} waiting now</small></div><a href="${mapLink(h.lat,h.lng)}" target="_blank" rel="noopener">map ↗</a></div>`).join("")||`<p class="p5m">No data yet.</p>`}</div>
